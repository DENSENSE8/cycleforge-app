name: Desktop release

# Publishes the Electron shell installers to a GitHub Release, which is the same
# feed `electron-updater` polls (see electron-builder.yml → publish).
#
# WHEN THIS RUNS — and why it is NOT on every deploy.
#
# The shell is a thin hosted-URL wrapper: it loads the deployed Next app over
# HTTPS and bundles no application code. So a Vercel deploy already reaches every
# desktop install — no release, no download, nothing for an operator to do.
#
# This workflow exists only for changes to the SHELL ITSELF (electron/**, the
# builder configs, the Electron version). Wiring it to every deploy would push a
# ~100 MB download to every bench PC for a change that is already live on them.
#
#   git tag desktop-v0.1.2 && git push origin desktop-v0.1.2
#
# REQUIRED SECRETS (macOS signing + notarization — without these the Mac builds
# produce installers that Gatekeeper warns on AND that can never auto-update,
# because Squirrel.Mac refuses unsigned updates):
#   CSC_LINK                     base64 of your Developer ID .p12
#   CSC_KEY_PASSWORD             password for that .p12
#   APPLE_ID                     Apple account email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that account
#   APPLE_TEAM_ID                10-char team id
# Optional, for signed Windows:
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
# GITHUB_TOKEN is provided automatically and is what electron-builder publishes with.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.2)'
        required: true

permissions:
  contents: write # create the release + upload assets

jobs:
  macos:
    name: macOS (Apple Silicon · Intel · legacy Intel)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The shell's version comes from electron/package.json (directories.app is
      # `electron`), NOT the repo root — so derive it from the tag rather than
      # hand-syncing two manifests and shipping a mislabelled installer.
      - name: Set shell version from tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#desktop-v}"; fi
          echo "Building shell version $VERSION"
          node -e "const f='electron/package.json',p=require('./'+f);p.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$VERSION"

      - run: npm run desktop:deps

      # Modern: arm64 + Intel, macOS 11+. Publishes dmg (install) AND zip, which
      # is what electron-updater actually consumes on macOS.
      - name: Build + publish modern macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always

      # Legacy Intel (macOS 10.13–10.15, Electron 22). Published as a plain asset
      # with `--publish never`: it must NOT write latest-mac.yml, or a legacy
      # install would be offered a current-Electron update that cannot launch on
      # 10.x. Attach it by hand instead.
      - name: Build legacy Intel macOS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --mac dmg --x64 --config electron-builder.mac-intel-legacy.yml --publish never

      - name: Attach legacy Intel dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" desktop-dist/*-x64-legacy.dmg --clobber

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set shell version from tag
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#desktop-v}"; fi
          node -e "const f='electron/package.json',p=require('./'+f);p.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')" "$VERSION"

      - run: npm run desktop:deps

      - name: Build + publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish always
