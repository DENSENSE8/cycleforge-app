<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle Forge Warehouse OS</title>

<!-- The three faces the design actually depends on. Naming them in a
     font stack is not loading them: without this link every condensed
     technical label (rail labels, badges, table headers, pipeline
     steps) silently renders in a NON-condensed fallback, and the mono
     column loses its tabular metrics. Google Fonts is also the one
     external host the Artifact CSP admits, so the published twin gets
     the same faces as the local file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<style>
  /* ================================================================
     CYCLE FORGE — WAREHOUSE OS
     Iteration-ready HTML prototype. Self-contained. No build step.

     DESIGN LAW, as of 2026-08-22 — squared-off WMS pass:
       1. RADIUS EXISTS ONCE. `--r-hud` on the workspace frame. Nothing
          else in this file may carry a border-radius. There is no
          --r-sm/md/lg/xl/full to reach for; they were deleted so the
          rule is enforced by absence rather than by discipline.
       2. NOTHING ANIMATES GEOMETRY. No transition and no keyframe may
          touch width, height, top/left/right/bottom, margin, padding,
          transform or flex. Rails expand instantly. Panels appear
          instantly. Banners appear instantly. The only animatable
          properties in this file are colour and opacity, and they are
          capped at --t-tint (80ms), which composites off the main
          thread and never moves a neighbour.
       3. BORDERS CARRY THE STRUCTURE. No drop shadows anywhere. With
          no radius and no elevation, a 1px stroke is the only thing
          separating one surface from the next, so strokes are pitched
          up until they can actually do that job.
       4. STATE IS DRAWN WITH OUTLINE, NOT BORDER. `outline` does not
          participate in layout, so a hover/focus ring can be 2px
          without shifting a single pixel of content.
     ================================================================ */

  :root {
    /* Typography */
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-condensed: "IBM Plex Sans Condensed", "Inter", sans-serif;
    --font-mono: "IBM Plex Mono", "SF Mono", Monaco, monospace;

    /* Size scale (rem) */
    --sz-technical-label: 0.5625rem;   /* 9px */
    --sz-xs: 0.75rem;                  /* 12px */
    --sz-data-value: 0.8125rem;        /* 13px */
    --sz-sm: 0.875rem;                 /* 14px */
    --sz-md: 1rem;                     /* 16px */
    --sz-lg: 1.125rem;                 /* 18px */
    --sz-xl: 1.25rem;                  /* 20px */
    --sz-2xl: 1.5rem;                  /* 24px */

    /* ---- RADIUS ----------------------------------------------------
       Two tokens. That is the whole set.
       --r-hud is the boundary between chrome and work; it is the only
       non-zero radius in the application. Set it to 0 for a fully
       flush terminal read, or back up to 16px for the visor read —
       one line, whole-app effect. Nothing else may declare a radius. */
    --r-none: 0px;
    --r-hud: 4px;

    /* Spacing scale */
    --sp-0: 0px;
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 20px;
    --sp-6: 24px;
    --sp-8: 32px;

    /* Elevation bands (stacking order only — no shadows exist) */
    --z-base: 0;
    --z-raised: 10;
    --z-sticky: 30;
    --z-header: 40;
    --z-dropdown: 50;
    --z-panel: 100;
    --z-panelPopover: 120;
    --z-modal: 200;
    --z-banner: 350;
    --z-command: 1000;

    /* ---- MOTION ----------------------------------------------------
       One duration, and it is only ever spent on colour or opacity.
       There is no --t-normal / --t-slow, and no easing curve token,
       because an eased tint is indistinguishable from a linear one at
       80ms and an easing token invites geometry to borrow it. */
    --t-tint: 80ms;

    /* Geometry */
    --header-height: 40px;
    --rail-width: 40px;
    --rail-expanded: 208px;
    --tool-panel-width: 280px;
    --control-h: 26px;

    /* Tile floors — the application's real minimums, not a guess.
       D4 is still open: 784 is the session/scan-bench floor and 520 is
       the proposed table floor. The canvas scrolls rather than crushing
       below them, which is what makes the geometry problem visible
       instead of silent. */
    --tile-min-session: 784px;
    --tile-min-table: 520px;

    /* LIGHT THEME — semantic tokens */
    --text-primary: #111111;
    --text-secondary: #52525b;
    --text-muted: #71717a;
    --text-inverse: #ffffff;
    --text-accent: #1d4ed8;
    --text-success: #15803d;
    --text-warning: #b45309;
    --text-danger: #b91c1c;
    --text-label: #52525b;
    --text-value: #111111;
    --text-technical: #71717a;

    --surface-background: #f4f4f5;
    --surface-containerLowest: #ffffff;
    --surface-containerLow: #f4f4f5;
    --surface-container: #e9e9ec;
    --surface-containerHigh: #dcdce0;
    --surface-containerHighest: #c4c4cb;
    --surface-dim: #a1a1aa;

    --bg-canvas: #dcdce0;
    --bg-surface: #f4f4f5;
    --bg-subtle: #fafafa;
    --bg-inverse: #111111;

    --surfaceSubtle-success: rgba(21, 128, 61, 0.10);
    --surfaceSubtle-warning: rgba(180, 83, 9, 0.10);
    --surfaceSubtle-danger: rgba(185, 28, 28, 0.10);
    --surfaceSubtle-accent: rgba(29, 78, 216, 0.10);

    /* Strokes do all the structural work now — pitched up accordingly */
    --border-subtle: #d4d4d8;
    --border-strong: #a1a1aa;
    --border-hud: #71717a;
    --border-accent: #1d4ed8;
    --border-success: #15803d;
    --border-warning: #b45309;
    --border-danger: #b91c1c;
  }

  [data-theme="dark"] {
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-muted: #7c7c86;
    --text-inverse: #09090b;
    --text-accent: #60a5fa;
    --text-success: #4ade80;
    --text-warning: #fbbf24;
    --text-danger: #f87171;
    --text-label: #a1a1aa;
    --text-value: #f4f4f5;
    --text-technical: #7c7c86;

    --surface-background: #0b0b0d;
    --surface-containerLowest: #151518;
    --surface-containerLow: #1c1c20;
    --surface-container: #26262b;
    --surface-containerHigh: #33333a;
    --surface-containerHighest: #4a4a53;
    --surface-dim: #6b6b76;

    --bg-canvas: #060607;
    --bg-surface: #151518;
    --bg-subtle: #1c1c20;
    --bg-inverse: #f4f4f5;

    --surfaceSubtle-success: rgba(74, 222, 128, 0.12);
    --surfaceSubtle-warning: rgba(251, 191, 36, 0.12);
    --surfaceSubtle-danger: rgba(248, 113, 113, 0.12);
    --surfaceSubtle-accent: rgba(96, 165, 250, 0.14);

    --border-subtle: #303036;
    --border-strong: #52525b;
    --border-hud: #6b6b76;
    --border-accent: #60a5fa;
    --border-success: #4ade80;
    --border-warning: #fbbf24;
    --border-danger: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* LAW 1, enforced. Every element is square unless it opts in by
     literally naming --r-hud, and only the canvas frame does. */
  *, *::before, *::after { border-radius: var(--r-none); }

  html, body {
    height: 100%;
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.45;
    color: var(--text-primary);
    background: var(--bg-canvas);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  /* One square focus ring, inset so it never nudges layout. */
  :focus-visible {
    outline: 2px solid var(--border-accent);
    outline-offset: -2px;
  }

  .wos {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ===== HEADER — the beam ==========================================
     Three parts only: corner cluster · context line · overflow.
     Pairing and the timers are TOOLS and live in the right rail; they
     are not header chrome, because the beam reports identity and never
     verbs. ================================================================ */
  .wos-header {
    height: var(--header-height);
    background: var(--surface-containerLowest);
    border-bottom: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    padding: 0 var(--sp-1);
    gap: var(--sp-1);
    flex-shrink: 0;
    z-index: var(--z-header);
    position: relative;
  }

  /* --- corner cluster: SCAN · SEARCH · CONTEXT, in that order --- */
  .corner-cluster {
    display: flex;
    align-items: stretch;
    height: var(--control-h);
    flex-shrink: 0;
    border: 1px solid var(--border-strong);
    background: var(--surface-containerLow);
  }

  .corner-cluster > * + * { border-left: 1px solid var(--border-strong); }

  .zone-scan {
    display: flex;
    align-items: center;
    gap: var(--sp-1);
    min-width: 300px;
    padding: 0 var(--sp-2);
    background: var(--surface-containerLowest);
  }

  .zone-scan:focus-within { background: var(--surfaceSubtle-accent); }
  .zone-scan > svg { flex-shrink: 0; color: var(--text-secondary); }

  .scan-input-wrap { display: flex; align-items: center; flex: 1; min-width: 0; }

  .scan-input-wrap input {
    border: none;
    background: transparent;
    outline: none;
    font: inherit;
    color: inherit;
    width: 100%;
    font-size: var(--sz-xs);
    min-width: 0;
    letter-spacing: 0.01em;
  }

  .scan-input-wrap input::placeholder { color: var(--text-muted); }

  /* The 2x2 mode matrix — two axes, drawn as two square segment pairs */
  .mode-toggle {
    display: flex;
    align-items: stretch;
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    flex-shrink: 0;
    font-family: var(--font-condensed);
    font-weight: 600;
    border: 1px solid var(--border-subtle);
    height: 16px;
    align-self: center;
  }

  .mode-toggle span {
    cursor: pointer;
    padding: 0 var(--sp-1);
    display: flex;
    align-items: center;
    transition: background-color var(--t-tint), color var(--t-tint);
    user-select: none;
  }

  .mode-toggle span + span { border-left: 1px solid var(--border-subtle); }
  .mode-toggle span:hover { color: var(--text-secondary); background: var(--surface-containerLow); }
  .mode-toggle span.active {
    background: var(--text-primary);
    color: var(--text-inverse);
  }
  /* The two axes are separated by a heavier rule so the matrix reads
     as input-mode | query-mode and not as one four-way switch. */
  .mode-toggle .axis-gap { border-left: 3px solid var(--text-primary); }

  /* SCAN-ARMED — permanent, and welded to the scan field.
     Not a toast. The operator must be able to see where the next scan
     lands without leaving the carton, so it never auto-hides and it
     never moves. */
  .scan-armed {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 var(--sp-2);
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: var(--font-condensed);
    font-weight: 600;
    background: var(--surfaceSubtle-success);
    color: var(--text-success);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .scan-armed .mark {
    width: 7px;
    height: 7px;
    background: var(--text-success);
    flex-shrink: 0;
  }

  .scan-armed.parked { background: var(--surfaceSubtle-warning); color: var(--text-warning); }
  .scan-armed.parked .mark { background: var(--text-warning); }
  .scan-armed.ended { background: var(--surface-container); color: var(--text-muted); }
  .scan-armed.ended .mark { background: var(--text-muted); }
  .scan-armed.error { background: var(--surfaceSubtle-danger); color: var(--text-danger); }
  .scan-armed.error .mark { background: var(--text-danger); }

  .cluster-btn {
    width: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background-color var(--t-tint), color var(--t-tint);
    flex-shrink: 0;
    font: inherit;
  }

  .cluster-btn:hover { background: var(--surface-container); color: var(--text-primary); }
  .cluster-btn.active { background: var(--text-primary); color: var(--text-inverse); }

  .zone-context {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 var(--sp-2);
    color: var(--text-secondary);
    font-size: var(--sz-xs);
    background: transparent;
    border: none;
    cursor: pointer;
    font: inherit;
    transition: background-color var(--t-tint);
  }

  .zone-context:hover { background: var(--surface-container); }

  /* Structurally the carton chip: leading glyph + mono value, transparent
     until hover. The one addition is the STATE MARK, because a session has a
     state and a carton does not. Square, per F4 — at 7px it reads where a
     dot does not, and it matches the frame. */
  .zone-session {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 var(--sp-2);
    height: var(--control-h);
    color: var(--text-secondary);
    font-size: var(--sz-xs);
    background: transparent;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    font: inherit;
    white-space: nowrap;
    transition: background-color var(--t-tint), color var(--t-tint);
  }

  .zone-session:hover { background: var(--surface-container); }

  .zone-session .mark {
    width: 7px;
    height: 7px;
    flex-shrink: 0;
    background: var(--text-success);
  }

  /* Session state is a SHARED VOCABULARY (U4) — the same four colours the
     tile spine uses, so the beam and the object never disagree. */
  .zone-session.parked .mark { background: var(--text-warning); }
  .zone-session.parked { color: var(--text-warning); }
  .zone-session.ended .mark { background: var(--text-muted); }
  .zone-session.ended { color: var(--text-muted); }
  .zone-session.error .mark { background: var(--text-danger); }
  .zone-session.error { color: var(--text-danger); }

  /* --- the context line: the only place that says what is happening --- */
  .context-line {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    height: var(--control-h);
    font-size: var(--sz-xs);
    overflow: hidden;
    white-space: nowrap;
  }

  .ctx-seg {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    overflow: hidden;
  }

  .ctx-sep {
    width: 1px;
    height: 14px;
    background: var(--border-strong);
    flex-shrink: 0;
  }

  /* Segment 1 — global context / process stage. Scan type IS the
     pipeline position, so the stage strip lives here, not in its own
     zone. Squares, not dots: a 6px square is more legible than a 6px
     circle and it reads as a step in a track. */
  .ctx-global {
    font-family: var(--font-condensed);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .pipeline { display: flex; align-items: stretch; height: 14px; border: 1px solid var(--border-subtle); }

  .pipeline-step {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 5px;
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-family: var(--font-condensed);
    font-weight: 600;
  }

  .pipeline-step + .pipeline-step { border-left: 1px solid var(--border-subtle); }

  .pipeline-mark {
    width: 5px;
    height: 5px;
    background: var(--surface-containerHighest);
    flex-shrink: 0;
  }

  .pipeline-step.done { color: var(--text-success); }
  .pipeline-step.done .pipeline-mark { background: var(--text-success); }
  .pipeline-step.current {
    color: var(--text-inverse);
    background: var(--text-primary);
  }
  .pipeline-step.current .pipeline-mark { background: var(--text-accent); }

  /* Segment 2 — the session title, renamed in place, right here. */
  .ctx-session {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .session-title {
    font-weight: 600;
    font-size: var(--sz-xs);
    color: var(--text-primary);
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    padding: 1px 4px;
    cursor: text;
    font-family: inherit;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: background-color var(--t-tint), border-color var(--t-tint);
  }

  .session-title:hover { border-bottom-color: var(--border-strong); }
  .session-title.unnamed { color: var(--text-muted); font-weight: 500; font-style: italic; }

  .session-title-input {
    font: inherit;
    font-size: var(--sz-xs);
    font-weight: 600;
    color: var(--text-primary);
    background: var(--surface-containerLowest);
    border: 1px solid var(--border-accent);
    outline: none;
    padding: 1px 4px;
    width: 200px;
  }

  .session-state {
    font-family: var(--font-condensed);
    font-size: var(--sz-technical-label);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 1px 5px;
    border: 1px solid var(--border-success);
    background: var(--surfaceSubtle-success);
    color: var(--text-success);
    flex-shrink: 0;
  }

  .session-state.parked { border-color: var(--border-warning); background: var(--surfaceSubtle-warning); color: var(--text-warning); }
  .session-state.ended  { border-color: var(--border-strong); background: var(--surface-container); color: var(--text-muted); }
  .session-state.error  { border-color: var(--border-danger); background: var(--surfaceSubtle-danger); color: var(--text-danger); }

  /* Segment 3 — carton context of scan type */
  .ctx-carton { color: var(--text-secondary); min-width: 0; }
  .ctx-fallback { display: flex; align-items: center; gap: 5px; }
  .ctx-fallback[hidden] { display: none; }
  .ctx-fallback #ctxFallbackHint { font-size: var(--sz-technical-label); color: var(--text-muted); }

  /* ===== SESSION TILE SPINE =========================================
     The session's identity now lives ON the session, which is where the
     operator is already looking. Full tile width buys the pipeline a real
     strip instead of four squeezed segments in shared chrome — and it is
     the level the procedure STEPS slot into later (A7 / P1). */
  .tile-spine {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: var(--sp-2);
    margin-bottom: var(--sp-2);
  }

  .tile-spine-identity {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex-wrap: wrap;
  }

  .tile-spine .pipeline { height: 20px; width: 100%; }
  .tile-spine .pipeline-step { flex: 1; justify-content: center; }

  /* Fixed width, so the context line's budget is a constant and not a
     lottery. Everything here is tabular so the digits do not jitter. */
  .header-face {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
    height: var(--control-h);
    width: 128px;
    justify-content: center;
    padding: 0 var(--sp-2);
    border: 1px solid var(--border-strong);
    background: var(--surface-containerLow);
    color: var(--text-secondary);
    font: inherit;
    font-size: var(--sz-xs);
    cursor: pointer;
    transition: background-color var(--t-tint), color var(--t-tint), border-color var(--t-tint);
  }

  .header-face:hover { background: var(--surface-container); }
  .header-face .face-sep { color: var(--text-muted); }
  .header-face .mono { color: inherit; }

  /* State is carried by the pair, not by a separate badge. */
  .header-face.on-target { border-color: var(--border-success); color: var(--text-success); background: var(--surfaceSubtle-success); }
  .header-face.near      { border-color: var(--border-warning); color: var(--text-warning); background: var(--surfaceSubtle-warning); }
  .header-face.over      { border-color: var(--border-danger);  color: var(--text-danger);  background: var(--surfaceSubtle-danger); }
  .header-face.idle      { color: var(--text-muted); }

  /* Pinned tools are RAIL cells — same 28px column as a pin, a tab and a
     recent on the left. The drop line is horizontal because the rail is a
     column, not a row. */
  #headerTools .cluster-btn {
    position: relative;
    width: 28px;
    height: 28px;
    color: var(--text-secondary);
  }
  .rail.expanded #headerTools .cluster-btn { width: 100%; justify-content: flex-start; padding: 0 var(--sp-2); gap: var(--sp-2); }
  #headerTools .cluster-btn:hover { background: var(--surface-container); color: var(--text-primary); }
  #headerTools .cluster-btn[draggable="true"] { cursor: grab; }
  #headerTools.drop-target { outline: 2px dashed var(--border-accent); outline-offset: -2px; }
  #headerTools .cluster-btn.drop-before::before {
    content: ''; position: absolute; left: 2px; right: 2px; top: -1px;
    height: 2px; background: var(--border-accent);
  }
  .hp-chord {
    position: absolute; bottom: 0; right: 1px;
    font-family: var(--font-mono); font-size: 8px; line-height: 8px;
    color: var(--text-muted); pointer-events: none;
  }

  /* The overflow list is the DRAG SOURCE for pinning. */
  .tool-drop {
    position: absolute;
    top: var(--header-height);
    right: calc(var(--rail-width) + var(--sp-1));
    width: 248px;
    background: var(--surface-containerLowest);
    border: 1px solid var(--border-hud);
    z-index: var(--z-panelPopover);
    display: none;
    flex-direction: column;
  }
  .tool-drop.open { display: flex; }
  .tool-drop .row {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 5px var(--sp-3); font-size: var(--sz-xs);
    cursor: grab; border: none; background: transparent; color: var(--text-primary);
    width: 100%; text-align: left; font: inherit;
    transition: background-color var(--t-tint);
  }
  .tool-drop .row:hover { background: var(--surface-container); }
  .tool-drop .row.is-pinned { color: var(--text-muted); }
  .tool-drop .row .mono { margin-left: auto; font-size: 10px; }

  .header-overflow { flex-shrink: 0; display: flex; align-items: center; }

  /* ===== BODY ===== */
  .wos-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* ===== RAILS ======================================================
     Persistent icon strips. Expanding is a width change and therefore
     is INSTANT — no transition. A rail that tweens open occupies the
     canvas for the length of the tween while handing nothing back. */
  .rail {
    width: var(--rail-width);
    background: var(--surface-containerLowest);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--sp-1) 0;
    gap: 2px;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    z-index: var(--z-panel);
  }

  .rail.left { border-right: 1px solid var(--border-strong); }
  .rail.right { border-left: 1px solid var(--border-strong); }
  .rail.expanded {
    width: var(--rail-expanded);
    align-items: stretch;
    padding: var(--sp-1);
  }

  .rail-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
    transition: background-color var(--t-tint), color var(--t-tint);
    flex-shrink: 0;
    border: none;
    background: transparent;
    font: inherit;
  }

  .rail.expanded .rail-btn { width: 100%; justify-content: flex-start; padding: 0 var(--sp-2); gap: var(--sp-2); font-size: var(--sz-xs); }
  .rail-btn:hover { background: var(--surface-container); color: var(--text-primary); }
  .rail-btn.active { background: var(--text-primary); color: var(--text-inverse); }
  .rail-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .rail-btn .rail-btn-label { display: none; }
  .rail.expanded .rail-btn .rail-btn-label { display: inline; }

  /* A queued proposal is a fact the operator must see WITHOUT opening the
     panel — so it badges the icon. Square, like every other mark. */
  .rail-badge {
    position: absolute;
    top: 1px;
    right: 1px;
    min-width: 12px;
    height: 12px;
    padding: 0 2px;
    background: var(--text-warning);
    color: var(--text-inverse);
    font-family: var(--font-condensed);
    font-size: 9px;
    font-weight: 700;
    line-height: 12px;
    text-align: center;
  }

  .rail-btn { position: relative; }
  .rail.expanded .rail-badge { position: static; margin-left: auto; }

  .rail-divider {
    width: 24px;
    height: 1px;
    background: var(--border-subtle);
    margin: var(--sp-1) 0;
    flex-shrink: 0;
  }

  .rail.expanded .rail-divider { width: 100%; }

  /* The rail's own name, and its collapse control once it is open.
     COLLAPSED IT IS NOT SHOWN AT ALL — a 40px strip of icons has no room
     for prose, and a vertical word is prose read sideways. What the label
     was also doing collapsed, separating pins from tabs, a 1px divider
     does better and silently. */
  .rail-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: var(--sz-technical-label);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: var(--sp-2) 0;
    font-weight: 700;
    font-family: var(--font-condensed);
    user-select: none;
    cursor: pointer;
    background: transparent;
    border: none;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    width: 100%;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color var(--t-tint), color var(--t-tint);
  }

  .rail:not(.expanded) .rail-label { display: none; }
  .rail.expanded .rail-divider-collapsed { display: none; }
  .rail-label:hover { background: var(--surface-container); color: var(--text-primary); }

  .rail.expanded .rail-label {
    writing-mode: horizontal-tb;
    text-orientation: initial;
    padding: var(--sp-1) var(--sp-2);
    justify-content: flex-start;
    font-size: 10px;
    letter-spacing: 0.16em;
  }

  /* THE RAIL'S INNER EDGE IS THE CONTROL, AND IT IS THE ONLY ONE.
     The border between rail and canvas is the line that actually moves
     when the rail expands, so it is the line you grab — the same gesture
     as every splitter in every editor. Full height, so it is the longest
     target on the screen and it never changes size with the rail's
     contents; 6px wide, which is what a splitter has been for thirty
     years, and it fits the gutter beside a 28px button in a 40px rail
     without stealing a single click from one.
     There is no chevron and no collapse button anywhere: a second visible
     control for one verb was an apology for not trusting the first. */
  .rail-edge {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 6px;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    transition: background-color var(--t-tint);
  }

  .rail.left  .rail-edge { right: 0; }
  .rail.right .rail-edge { left: 0; }
  .rail-edge:hover { background: var(--surface-container); }

  /* The gutter the strip lives in. Collapsed it is already there — a 28px
     button centred in a 40px rail leaves 6px a side. Expanded, buttons go
     full-width, so the rail reserves it. */
  .rail.left.expanded  { padding-right: 8px; }
  .rail.right.expanded { padding-left: 8px; }

  /* THE SLACK stays live as a forgiving second target for the same verb.
     It carries no mark of its own — the edge owns that — and it costs
     nothing, because it is the one region of the rail that can never hold
     a tab, a pin or a recent. */
  .rail-slack {
    flex: 1;
    min-height: 20px;
    width: 100%;
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color var(--t-tint);
  }

  .rail-slack:hover { background: var(--surface-container); }

  /* The grip. Squares, not dots — the same reasoning as the stage strip —
     and permanently inked, because a mark that only appears on hover does
     not exist on a mounted tablet. */
  .grip {
    display: block;
    width: 2px;
    height: 14px;
    background: repeating-linear-gradient(
      to bottom, var(--border-strong) 0 2px, transparent 2px 5px);
  }

  .rail-edge:hover .grip { background: repeating-linear-gradient(
      to bottom, var(--text-secondary) 0 2px, transparent 2px 5px); }

  /* THE BOTTOM-LEFT CORNER. One control, and it is the SAME SIZE as the
     control at the top of the rail — a 28px cell with a 16px glyph. The
     rail is one column, so it gets one column width and one glyph size;
     a settings gear drawn smaller than the add button above it reads as
     a lesser control, and it is not one. No divider — the border is the
     divider — and theme lives in settings, not out here. */
  .rail-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    flex-shrink: 0;
    border-top: 1px solid var(--border-subtle);
    padding-top: 2px;
    margin-top: 2px;
  }

  .rail.expanded .rail-footer { flex-direction: row; align-items: stretch; gap: 2px; }
  .rail.expanded .rail-footer .rail-btn { width: auto; flex: 1; }

  .rail-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 100%;
    flex-shrink: 0;
  }

  .rail.expanded .rail-group { align-items: stretch; }

  .tab-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    overflow-x: hidden;
    width: 100%;
    align-items: center;
    /* Rail overflow (open question 6) answered as SCROLL: the strip is
       a fixed-width vertical column, so the tab list is the part that
       shrinks and scrolls. Pins and recents keep their height. */
    flex: 0 1 auto;
    min-height: 0;
  }

  .rail.expanded .tab-list { align-items: stretch; }

  .tab, .pin, .recent-item {
    width: 28px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    color: var(--text-secondary);
    transition: background-color var(--t-tint), color var(--t-tint);
    flex-shrink: 0;
    border: none;
    background: transparent;
    font: inherit;
  }

  .rail.expanded .tab,
  .rail.expanded .pin,
  .rail.expanded .recent-item {
    width: 100%;
    justify-content: flex-start;
    padding: 0 var(--sp-2) 0 var(--sp-3);
    gap: var(--sp-2);
    font-size: var(--sz-xs);
  }

  /* Collapsed, a rail is icons only — labels would spill past 40px. */
  .rail:not(.expanded) .tab-name,
  .rail:not(.expanded) .recents-header span { display: none; }

  .tab:hover, .pin:hover, .recent-item:hover { background: var(--surface-container); color: var(--text-primary); }
  .tab.active { background: var(--surface-containerHigh); color: var(--text-primary); font-weight: 600; }

  /* The active tab's lit cell — a square 3px edge bar, not a pill */
  .tab.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--text-primary);
  }

  .pin { color: var(--text-primary); }

  /* Per-tab colour is a 3px edge stripe, not a dot: it stays legible
     at rail width, it never becomes confetti because it is structural,
     and it reads the same expanded or collapsed. */
  .tab-color {
    width: 3px;
    height: 100%;
    position: absolute;
    right: 0;
    top: 0;
    flex-shrink: 0;
  }

  .rail.expanded .tab-color { right: 0; }

  .tab-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    text-align: left;
  }

  .recents-header {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px var(--sp-1);
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    font-family: var(--font-condensed);
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: none;
    width: 100%;
    justify-content: center;
    /* It is a row in the rail's one column, so it holds its row height
       instead of being the thing that gives way when the rail is tight —
       the tab list is the designated scroller, not this. */
    flex-shrink: 0;
    transition: color var(--t-tint);
  }

  .rail:not(.expanded) .recents-header { height: 26px; }
  .rail.expanded .recents-header { justify-content: flex-start; padding: 2px var(--sp-2); }
  .recents-header:hover { color: var(--text-primary); }
  .recents-header svg { flex-shrink: 0; }
  .rail:not(.expanded) .recents-chevron { display: none; }
  .rail.expanded .recents-icon { display: none; }
  /* The chevron flips instantly. It is a state read, not a performance. */
  .recents-header.collapsed svg { transform: rotate(-90deg); }

  /* Bottom-anchored and BOUNDED. Two independent scroll ports — a long tab
     list cannot starve recents and a long history cannot starve the tabs.
     That is a fuller answer to rail overflow than "the tab list scrolls". */
  .recents-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    align-items: center;
    /* Bounded tighter than half the rail: the bottom-left corner is a
       trail, not a second workspace. */
    max-height: 34vh;
    overflow-y: auto;
    overflow-x: hidden;
    flex-shrink: 0;
  }
  .rail.expanded .recents-list { align-items: stretch; }
  .recents-list.collapsed { display: none; }

  /* ===== RECENTS — per staff, per org. Never per session. =============
     Banded by kind in a FIXED order, MRU within a band. The band is what
     makes the list reachable by muscle memory: cartons sit at the same
     offset from the top whatever you did at another bench. Recency is
     not lost to the banding — it is carried by the marker instead, which
     is why the marker exists. */
  .recent-band { display: flex; flex-direction: column; width: 100%; align-items: center; }
  .rail.expanded .recent-band { align-items: stretch; }

  .recent-band-label {
    display: none;
    font-family: var(--font-condensed);
    font-size: var(--sz-technical-label);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 4px var(--sp-2) 2px;
  }

  .rail.expanded .recent-band-label { display: block; }
  /* Collapsed, a band is separated by SPACE, never by a rule.
     A hairline in this column already has a meaning — it is what divides
     pins from tabs from recents from the footer, i.e. "a different kind of
     thing starts here". Spending that same ink on "same kind of thing,
     next group" made five bands of one list read as five separate
     displays. Proximity groups them for free and adds no ink. */
  .rail:not(.expanded) .recent-band + .recent-band { margin-top: 5px; }

  /* A recent is a row in the same column as a tab and a pin, so it is the
     same cell: 28 x 26, glyph centred, glyph at 15px. It used to be 24px
     tall with a left-aligned 12px glyph, because the cell also had to fit
     the most-recent caret on its trailing edge without the two touching.
     That caret is gone, and with it the reason for a second row size. */
  .recent-item {
    color: var(--text-secondary);
    position: relative;
  }

  .rail.expanded .recent-item { height: auto; min-height: 26px; padding: 2px var(--sp-3) 2px var(--sp-3); }

  .recent-text { display: none; min-width: 0; flex: 1; text-align: left; }
  .rail.expanded .recent-text { display: block; }
  .recent-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--sz-xs); }
  .recent-sub {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--sz-technical-label);
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* Leading edge = this entry was touched by the LIVE session. It is a
     mark, not a scope: the entry outlives the session that made it. */
  .recent-item.in-session::before {
    content: '';
    position: absolute;
    left: 0; top: 2px; bottom: 2px;
    width: 3px;
    background: var(--text-success);
  }

  /* Trailing edge = the single most recent selection, anywhere in the
     list. One per rail, by definition. */
  /* The most recent selection is marked by the ROW, not by a caret beside
     it. A 9px triangle hung off the right edge of a 40px rail had to be
     absolutely positioned to avoid shoving the label, and it still crowded
     the row it was pointing at. The tint says the same thing and costs no
     space. */
  .recent-item.is-last { color: var(--text-primary); background: var(--surfaceSubtle-accent); }

  /* ===== CANVAS =====================================================
     The one place radius exists. --r-hud, one stroke, four sides. */
  .canvas-wrap {
    flex: 1;
    padding: var(--sp-2);
    overflow: hidden;
    position: relative;
    background: var(--bg-canvas);
    min-width: 0;
    display: flex;
  }

  .canvas {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 1.5px solid var(--border-hud);
    border-radius: var(--r-hud);
    background: var(--surface-containerLowest);
    position: relative;
    overflow: hidden;
    display: flex;
  }

  .canvas-scroll {
    display: flex;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* ===== TILES ======================================================
     Four states, four distinct treatments — because in a tiling
     manager hover and focus are different facts and one of them
     decides where the keystrokes go.
       hover       1px grey inset ring, no fill
       focused     2px accent inset ring + accent header + edge bar
       dragging    dashed ring + 40% opacity
       snap-target dashed accent ring + accent wash
     All four are `outline` or `background`, so none of them reflow. */
  .tile {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-strong);
    position: relative;
    min-width: var(--tile-min-table);
    background: var(--surface-containerLowest);
  }

  .tile[data-type="session"] { min-width: var(--tile-min-session); }
  .tile:last-child { border-right: none; }

  .tile:hover { outline: 1px solid var(--border-strong); outline-offset: -1px; }

  .tile.focused {
    outline: 2px solid var(--border-accent);
    outline-offset: -2px;
  }
  .tile.focused .tile-header {
    background: var(--surfaceSubtle-accent);
    color: var(--text-primary);
    border-bottom-color: var(--border-accent);
  }
  .tile.focused .tile-header::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border-accent);
  }

  .tile.dragging {
    opacity: 0.4;
    outline: 2px dashed var(--border-strong);
    outline-offset: -2px;
  }

  .tile.snap-target {
    background: var(--surfaceSubtle-accent);
    outline: 2px dashed var(--border-accent);
    outline-offset: -2px;
  }

  .tile-header {
    height: 26px;
    border-bottom: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    padding: 0 var(--sp-2);
    gap: var(--sp-2);
    font-size: 11px;
    color: var(--text-secondary);
    flex-shrink: 0;
    background: var(--surface-containerLow);
    position: relative;
    transition: background-color var(--t-tint), color var(--t-tint);
  }

  .tile-header .tile-identity {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    flex: 1;
    min-width: 0;
  }

  .tile-header .tile-color { width: 8px; height: 8px; flex-shrink: 0; }

  .tile-header .tile-title {
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tile-header .tile-type {
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-family: var(--font-condensed);
    font-weight: 700;
    border: 1px solid var(--border-subtle);
    padding: 0 4px;
  }

  /* Tile actions are always present — an opacity reveal is a hover
     dependency, and a mounted tablet has no hover. */
  .tile-header .tile-actions { display: flex; gap: 2px; flex-shrink: 0; }

  /* Close is the last thing in the header and the only red thing in it.
     Destructive, so it reads destructive before it is pressed — and it is
     always present, because a mounted tablet has no hover to reveal it. */
  .tile-header .tile-close:hover {
    background: var(--surfaceSubtle-danger);
    color: var(--text-danger);
  }

  .tile-body {
    flex: 1;
    overflow: auto;
    padding: var(--sp-3);
    font-size: var(--sz-data-value);
    line-height: 1.45;
    position: relative;
  }

  .tile-split-handle {
    position: absolute;
    right: -3px;
    top: 0;
    bottom: 0;
    width: 6px;
    cursor: col-resize;
    z-index: var(--z-raised);
    background: transparent;
    transition: background-color var(--t-tint);
  }

  .tile-split-handle:hover { background: var(--border-accent); }

  /* ===== EMPTY SLATE ===== */
  .empty-slate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    gap: var(--sp-4);
    color: var(--text-muted);
    text-align: center;
    padding: var(--sp-6);
  }

  .empty-slate h2 {
    font-size: var(--sz-xl);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-family: var(--font-condensed);
    color: var(--text-secondary);
  }

  .empty-slate p { font-size: var(--sz-sm); max-width: 380px; line-height: 1.55; }
  .empty-slate-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: center; }
  .empty-slate-hints {
    margin-top: var(--sp-2);
    font-size: var(--sz-xs);
    color: var(--text-muted);
    display: flex;
    gap: var(--sp-3);
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ===== TOOL PANEL =================================================
     It PUSHES. `position: absolute` + a shadow was the easy answer and
     the wrong one: on a bench a panel over the work is a panel you
     cannot read past. It is a flex sibling in normal flow, it appears
     and disappears instantly, and the canvas simply gets narrower. */
  .tool-panel {
    width: var(--tool-panel-width);
    flex-shrink: 0;
    background: var(--surface-containerLowest);
    border-left: 1px solid var(--border-strong);
    z-index: var(--z-panel);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .tool-panel.open { display: flex; }

  .tool-panel-header {
    height: 26px;
    border-bottom: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    padding: 0 var(--sp-1) 0 var(--sp-3);
    font-size: var(--sz-technical-label);
    font-family: var(--font-condensed);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-secondary);
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--surface-containerLow);
  }

  .tool-panel-body { padding: var(--sp-3); font-size: var(--sz-xs); overflow: auto; flex: 1; }

  .tool-panel-footer {
    border-top: 1px solid var(--border-subtle);
    padding: var(--sp-1) var(--sp-3);
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: var(--font-condensed);
    font-weight: 600;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* ===== SETTINGS — anchored to the corner that opens it ===== */
  .settings-popover {
    position: absolute;
    left: var(--sp-1);
    bottom: var(--sp-1);
    width: 248px;
    background: var(--surface-containerLowest);
    border: 1px solid var(--border-hud);
    z-index: var(--z-panelPopover);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .settings-popover.open { display: flex; }

  .settings-note {
    font-size: var(--sz-technical-label);
    line-height: 1.6;
    color: var(--text-muted);
  }

  /* ===== CONTEXT MENU ===== */
  .context-menu {
    position: fixed;
    background: var(--surface-containerLowest);
    border: 1px solid var(--border-strong);
    z-index: var(--z-dropdown);
    min-width: 184px;
    display: none;
    flex-direction: column;
    padding: 0;
  }

  .context-menu.open { display: flex; }

  .context-item {
    padding: 6px var(--sp-3);
    font-size: var(--sz-xs);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    color: var(--text-primary);
    border: none;
    background: transparent;
    font: inherit;
    width: 100%;
    text-align: left;
    transition: background-color var(--t-tint);
  }

  .context-item:hover { background: var(--surface-container); }
  .context-item.danger { color: var(--text-danger); }
  .context-item.danger:hover { background: var(--surfaceSubtle-danger); }
  .context-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  .context-divider { height: 1px; background: var(--border-subtle); }

  /* ===== BUTTONS =====
     A press is a colour swap. The old translateY(1px) moved the label
     under the operator's finger for 0 gain. */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-1);
    padding: 5px var(--sp-3);
    background: var(--surface-container);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-size: var(--sz-xs);
    font-weight: 600;
    cursor: pointer;
    transition: background-color var(--t-tint), color var(--t-tint), border-color var(--t-tint);
    font-family: inherit;
    line-height: 1.4;
    white-space: nowrap;
  }

  .btn:hover { background: var(--surface-containerHigh); }
  .btn:active { background: var(--surface-containerHighest); }

  .btn-primary { background: var(--text-primary); color: var(--text-inverse); border-color: var(--text-primary); }
  .btn-primary:hover { background: var(--text-accent); border-color: var(--text-accent); color: #ffffff; }
  .btn-primary:active { background: var(--text-accent); }
  .btn-sm { padding: 3px 10px; font-size: 11px; }
  .btn-icon { padding: 0; width: 26px; height: 26px; }

  /* ===== BADGES ===== */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0 5px;
    font-size: var(--sz-technical-label);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: var(--font-condensed);
    border: 1px solid currentColor;
    line-height: 15px;
  }

  .badge-success { background: var(--surfaceSubtle-success); color: var(--text-success); }
  .badge-warning { background: var(--surfaceSubtle-warning); color: var(--text-warning); }
  .badge-danger  { background: var(--surfaceSubtle-danger);  color: var(--text-danger); }
  .badge-accent  { background: var(--surfaceSubtle-accent);  color: var(--text-accent); }

  /* ===== UTILITIES ===== */
  .mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-size: var(--sz-xs);
    color: var(--text-secondary);
    letter-spacing: -0.01em;
  }

  .kbd {
    display: inline-flex;
    align-items: center;
    padding: 0 5px;
    background: var(--surface-container);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--text-secondary);
    line-height: 15px;
  }

  /* Data table — a grid, with column rules and zebra banding, because
     the job is reading one row across without losing it. */
  .data-table {
    width: 100%;
    font-size: var(--sz-xs);
    border-collapse: collapse;
  }

  .data-table th {
    text-align: left;
    padding: 5px var(--sp-2);
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-secondary);
    font-family: var(--font-condensed);
    font-weight: 700;
    background: var(--surface-container);
    border: 1px solid var(--border-strong);
    white-space: nowrap;
    position: sticky;
    top: 0;
  }

  .data-table td {
    padding: 4px var(--sp-2);
    border: 1px solid var(--border-subtle);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }

  .data-table tbody tr:nth-child(even) td { background: var(--surface-containerLow); }
  .data-table tbody tr:hover td { background: var(--surfaceSubtle-accent); }
  .data-table .col-xs { width: 22px; }
  .data-table .col-s { width: 108px; }
  .data-table .col-m { width: 168px; }

  /* Status marks are squares. At 7px a square is more legible than a
     circle and it matches everything else in the frame. */
  .status-dot { width: 7px; height: 7px; display: inline-block; flex-shrink: 0; }
  .status-dot.ok { background: var(--text-success); }
  .status-dot.warn { background: var(--text-warning); }
  .status-dot.err { background: var(--text-danger); }
  .status-dot.info { background: var(--text-accent); }

  /* Composer */
  .composer {
    border-top: 1px solid var(--border-strong);
    padding: var(--sp-2);
    display: flex;
    gap: var(--sp-2);
    align-items: flex-end;
    background: var(--surface-containerLow);
  }

  .composer-wrap { flex: 1; display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }

  .composer-toggle {
    display: flex;
    align-self: flex-start;
    border: 1px solid var(--border-subtle);
    font-size: var(--sz-technical-label);
    font-family: var(--font-condensed);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .composer-toggle span {
    padding: 1px var(--sp-2);
    cursor: pointer;
    color: var(--text-muted);
    transition: background-color var(--t-tint), color var(--t-tint);
    user-select: none;
  }

  .composer-toggle span + span { border-left: 1px solid var(--border-subtle); }
  .composer-toggle span:hover { color: var(--text-secondary); background: var(--surface-container); }
  .composer-toggle span.active { background: var(--text-primary); color: var(--text-inverse); }

  .composer textarea {
    width: 100%;
    border: 1px solid var(--border-strong);
    padding: 5px var(--sp-2);
    font: inherit;
    font-size: var(--sz-xs);
    background: var(--surface-containerLowest);
    color: var(--text-primary);
    resize: none;
    outline: none;
    min-height: 28px;
    max-height: 80px;
    line-height: 1.4;
  }

  .composer textarea:focus { border-color: var(--border-accent); }

  /* Offline banner — in the beam's flow band, appears instantly. */
  .offline-banner {
    height: 24px;
    background: var(--surfaceSubtle-warning);
    border-bottom: 1px solid var(--border-warning);
    display: none;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    font-size: var(--sz-technical-label);
    font-family: var(--font-condensed);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-warning);
    z-index: var(--z-banner);
    flex-shrink: 0;
  }

  .offline-banner.open { display: flex; }

  /* Launcher */
  .launcher {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: var(--z-command);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 14vh;
  }

  .launcher.open { display: flex; }

  .launcher-box {
    width: 560px;
    max-width: 92vw;
    background: var(--surface-containerLowest);
    border: 2px solid var(--border-hud);
    overflow: hidden;
  }

  .launcher-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--border-strong);
    padding: var(--sp-3) var(--sp-4);
    font: inherit;
    font-size: var(--sz-md);
    background: var(--surface-containerLowest);
    color: var(--text-primary);
    outline: none;
  }

  .launcher-input::placeholder { color: var(--text-muted); }
  .launcher-results { max-height: 340px; overflow: auto; }
  .launcher-group + .launcher-group { border-top: 1px solid var(--border-subtle); }

  .launcher-group-label {
    padding: 4px var(--sp-4);
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--text-secondary);
    font-family: var(--font-condensed);
    font-weight: 700;
    background: var(--surface-containerLow);
  }

  .launcher-item {
    padding: 6px var(--sp-4);
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    cursor: pointer;
    transition: background-color var(--t-tint), color var(--t-tint);
    border-left: 3px solid transparent;
  }

  .launcher-item:hover { background: var(--surface-containerLow); }
  .launcher-item.selected {
    background: var(--surfaceSubtle-accent);
    border-left-color: var(--border-accent);
  }

  .launcher-item-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-subtle);
    background: var(--surface-container);
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .launcher-item-title { font-size: var(--sz-sm); font-weight: 600; }
  .launcher-item-meta { font-size: var(--sz-xs); color: var(--text-muted); }
  .launcher-item-kbd { margin-left: auto; font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }

  /* Session popover */
  .session-popover {
    position: absolute;
    top: var(--header-height);
    right: var(--sp-1);
    width: 296px;
    background: var(--surface-containerLowest);
    border: 1px solid var(--border-hud);
    z-index: var(--z-panelPopover);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .session-popover.open { display: flex; }

  .session-popover-header {
    padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3);
    border-bottom: 1px solid var(--border-strong);
    background: var(--surface-containerLow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-condensed);
    font-size: var(--sz-technical-label);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .session-popover-body {
    padding: var(--sp-3);
    font-size: var(--sz-xs);
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .session-field { display: flex; flex-direction: column; gap: 3px; }

  .session-field label {
    font-size: var(--sz-technical-label);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    font-family: var(--font-condensed);
    font-weight: 700;
  }

  .session-field input {
    border: 1px solid var(--border-strong);
    padding: 4px var(--sp-2);
    font: inherit;
    font-size: var(--sz-xs);
    background: var(--surface-containerLowest);
    color: var(--text-primary);
    outline: none;
  }

  .session-field input:focus { border-color: var(--border-accent); }

  /* Responsive — the beam degrades by dropping the least identifying
     segment first: carton context, then the stage strip. The session
     title is the last thing standing because it is the only segment
     that names the work. */
  @media (max-width: 1440px) {
    .ctx-carton, .ctx-carton + .ctx-sep { display: none; }
  }

  @media (max-width: 1180px) {
    .pipeline { display: none; }
  }

  /* Reduced motion — near-empty by construction. Colour tints are the
     only thing left to shorten, and they already do not move anything. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Scrollbars — square, and wide enough to hit with a glove. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--surface-containerLow); }
  ::-webkit-scrollbar-thumb { background: var(--surface-containerHighest); border: 2px solid var(--surface-containerLow); }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface-dim); }
</style>

<!-- APP -->

  <!-- ===== GLOBAL HEADER — the beam ================================

  <header class="wos-header" id="header">

                           mode here; scan-vs-search is not a mode, because a
                           wedge burst and human typing are different input
                           paths and both work at once.

                           focused tile. -->
        <div class="mode-toggle" id="scanModes" title="Typing: auto = searches · key = counts as a scan   |   find = search org · flt = filter focused tile">
          <span class="active" data-mode="auto">auto</span>

    </div>

    <!-- the context line — the only place that says what is happening now -->
    <!-- THE CONTEXT LINE, after 2026-08-22.
         §2 was transcribed before the session tile existed. Once S2 rules that
         exactly ONE session tile is on canvas, the session's identity has a
         home ON THE OBJECT, and repeating it 700px away in centred chrome is
         a saccade for nothing.
         What stays: only what is GENUINELY GLOBAL, plus a FALLBACK that
         renders the session identity when — and only when — the session tile
         is not on screen. The canvas scrolls horizontally below its floors,
         so the tile CAN be scrolled away; the beam is the one surface that
         cannot. No duplication in the normal case, a safety net in the one
         case that needs it. -->
    <div class="context-line" id="contextLine"></div>

    <!-- THE HEADER FACE — one slot, fixed width, readouts only.
         It is `elapsed / target`, not two counters: "how long am I taking"

    <button class="header-face" id="headerFace" onclick="App.toggleTool('timer')"

   may schedule a geometry change over time. No setTimeout that hides a
   thing, no rAF that eases a size, no class that starts a keyframe.
   Every state change below paints on the next frame and stays put.
   ================================================================ */

  // ---- STATE ----

       themselves without being told they are late gets exactly that.

    faceMode: 'pace',
    stopwatch: 0,
    swRunning: false,
    recentsCollapsed: false,

       exists today (`ops_events.session_type`). When staff procedures land the

       turns "what happened" into "why". Free-text why is deferred. */
    trail: {
      's-marisol': { session:'Packing #7', type:'pack', status:'armed', groups:[
        { stage:'unbox', events:[
          { t:'10:04:12', verb:'create', entity:'receiving_line', detail:'RCV-8842 / L-1 \u00b7 SKU-9921' },

    }
  };

  const PALETTE = ['#15803d','#1d4ed8','#b45309','#b91c1c','#6d28d9','#0f766e','#a16207'];

  /* A scan session is discriminated by `scan_type`; a task session by the
     SURFACE_KEY whose job it is doing (work_sessions, 2026-08-22b). Anything
     not listed here is a scan session. */
  const SESSION_KINDS = { 'fba-build': 'task' };

  /* CORRECTED 2026-08-22 — an import is NOT a session.
     Orders arrive by cron / webhook sync. The sync already streams an
     exceptions list (orders-sync/client.ts: "a 400-row exceptions stream").
     So there are three things, and only one of them is a session:
       PRODUCER  cron · webhook · manual upload   → a TOOL (Actuator)
       QUEUE     what the sync could not resolve  → a TABLE
       WORK      resolving one exception          → a ROW ACTION
     A manual upload is just another producer feeding the same queue — you
     build ONE triage surface, not one per source.
     The unit of work is the ROW, each fix commits immediately, so nothing is
     staged and K1 says table, not session.
     The session case is when the unit of work is the BATCH — an FBA shipment
     is one object built from N selected units, and half a shipment is not a
     thing. That state has to survive, so that one IS a task session. */
  const FBA_STEPS = ['select', 'box', 'label', 'ship'];

  /* TOOL REGISTRY — `scope` is the only availability field.
       global  · always listed. Needs no session, receives none.
       session · listed only while a session is armed; RECEIVES it.
       tile    · listed only while a tile is focused; receives it.
     `appliesTo` narrows a session tool to specific scan types.
     `class` is the input/attention class (T1) — it decides where the tool may
     live and whether it may ever auto-summon, not how big it is. */
  const TOOLS = [
    /* `agent` is a scope of one, and the band exists because the distinction
       is real: the assistant is the ONLY tool that writes on your behalf.
       `agent_mutations.actor_kind` already separates 'agent' from 'operator'
       in the ledger; the rail says the same thing. */
    { key:'ai',        label:'Assistant',     icon:'assistant', scope:'agent',   cls:'instrument' },
    { key:'import',    label:'Import orders', icon:'file',      scope:'global',  cls:'actuator'   },
    { key:'calc',      label:'Calculator',    icon:'calc',      scope:'global',  cls:'instrument' },
    { key:'photos',    label:'Photo library', icon:'image',     scope:'global',  cls:'library'    },
    { key:'manuals',   label:'Manuals',       icon:'book',      scope:'global',  cls:'library'    },
    { key:'printer',   label:'Label printer', icon:'printer',   scope:'global',  cls:'actuator'   },
    { key:'stopwatch', label:'Stopwatch',     icon:'stopwatch', scope:'session', cls:'readout'    },
    { key:'pairing',   label:'Pairing',       icon:'split',     scope:'session', cls:'instrument', appliesTo:['unbox','packing'] },
  ];

  const toolAvailable = t =>
    t.scope === 'global' ||
    (t.scope === 'session'
      && state.sessionState === 'armed'
      && (!t.appliesTo || t.appliesTo.includes(state.activeTab)));

  /* Band order is FIXED and is the whole point: a band never moves, so the
     operator reaches for cartons at the same offset from the top no matter
     what they did at another bench. MRU applies inside a band only. */
  const RECENT_KINDS = [
    { kind:'carton',  label:'Cartons',  icon:'box',     cap:3 },
    { kind:'pack',    label:'Packs',    icon:'table',   cap:3 },
    { kind:'label',   label:'Labels',   icon:'printer', cap:2 },
    { kind:'pickup',  label:'Pickups',  icon:'file',    cap:2 },
    { kind:'ticket',  label:'Tickets',  icon:'book',    cap:2 },
    { kind:'search',  label:'Searches', icon:'search',  cap:2 },
    { kind:'session', label:'Sessions', icon:'check',   cap:2 },
  ];
  const ICONS = ['box','table','file','printer','image','book','check'];

  // ---- DOM REFS ----
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const leftTabs = $('leftTabs');
  const leftPins = $('leftPins');
  const recentsList = $('recentsList');
  const toolPanel = $('toolPanel');
  const toolPanelBody = $('toolPanelBody');
  const toolPanelTitle = $('toolPanelTitle');
  const toolPanelFooter = $('toolPanelFooter');
  const ctxMenu = $('ctxMenu');
  const launcher = $('launcher');
  const launcherInput = $('launcherInput');
  const launcherResults = $('launcherResults');
  const sessionPopover = $('sessionPopover');
  const settingsPopover = $('settingsPopover');
  const zoneSession = $('zoneSession');

  // ---- RENDER: PINNED PAGES ----
  /* Pins sit ABOVE the tabs and above the PAGES label. A pin is a
     destination the operator always wants within reach; a tab is
     something currently open. The daily check is the canonical pin. */
  function renderPins() {
    leftPins.innerHTML = '';
    state.pins.forEach(pin => {
      const el = document.createElement('button');
      el.className = 'pin';
      el.title = pin.title + ' — pinned';
      el.onclick = () => addTile(pin.id, pin.title, 'table');
      el.innerHTML = iconFor(pin.icon, 15) + '<span class="tab-name">' + escapeHtml(pin.title) + '</span>';
      leftPins.appendChild(el);
    });
  }

  // ---- RENDER: TABS ----
  function renderTabs() {
    leftTabs.innerHTML = '';
    state.tabs.forEach(tab => {
      const el = document.createElement('button');
      el.className = 'tab' + (tab.id === state.activeTab ? ' active' : '');
      el.dataset.tab = tab.id;
      el.title = tab.title;
      el.onclick = () => focusTab(tab.id);
      el.oncontextmenu = e => {
        e.preventDefault();
        const tile = state.tiles.find(t => t.tab === tab.id);
        showCtx(e, tile ? tile.id : null);
      };
      el.innerHTML = iconFor(tab.icon, 15) +
        '<span class="tab-name">' + escapeHtml(tab.title) + '</span>' +
        (tab.color ? '<span class="tab-color" style="background:' + tab.color + '"></span>' : '');
      leftTabs.appendChild(el);
    });
  }

  // ---- RENDER: RECENTS ----
  /* Per staff, per org — the rail shows the staffer's own trail and nothing
     else. Two edge devices, deliberately on opposite edges so an entry can
     carry both without ambiguity:
       leading  3px green — touched by the LIVE session (a mark, not a scope)
       trailing solid caret — the single most recent selection, anywhere
     The marker exists BECAUSE of the banding. Banding buys position
     stability and costs you "the newest thing is at the top"; the marker
     buys that back without moving a row. */
  function renderRecents() {
    const list = $('recentsList');
    list.innerHTML = '';

    const newest = state.recents.reduce(
      (best, r) => (best === null || r.at > best.at ? r : best), null);

    RECENT_KINDS.forEach(band => {
      const rows = state.recents
        .filter(r => r.kind === band.kind)
        .sort((a, b) => b.at - a.at)
        .slice(0, band.cap);
      if (!rows.length) return;

      const wrap = document.createElement('div');
      wrap.className = 'recent-band';
      wrap.dataset.kind = band.kind;

      const label = document.createElement('div');
      label.className = 'recent-band-label';
      label.textContent = band.label;
      wrap.appendChild(label);

      rows.forEach(r => {
        const isLast = newest && r.id === newest.id;
        const el = document.createElement('button');
        el.className = 'recent-item'
          + (r.sessionId === 's7' ? ' in-session' : '')
          + (isLast ? ' is-last' : '');
        el.title = (isLast ? 'Most recent selection · ' : '')
          + band.label.replace(/s$/, '') + ' · ' + r.title + ' — ' + r.sub
          + (r.sessionId === 's7' ? ' · this session' : '');
        el.onclick = () => touchRecent(r.id);
        el.innerHTML =
          iconFor(band.icon, 15) +
          '<span class="recent-text">' +
            '<span class="recent-title">' + escapeHtml(r.title) + '</span>' +
            '<span class="recent-sub">' + escapeHtml(r.sub) + '</span>' +
          '</span>' +
          '';
        wrap.appendChild(el);
      });
      list.appendChild(wrap);
    });

    list.classList.toggle('collapsed', state.recentsCollapsed);
    $('recentsHeader').classList.toggle('collapsed', state.recentsCollapsed);
  }

  /* Selecting a recent re-stamps it as the newest — the marker moves, the
     band does not. That is the banding/recency trade made visible. */
  function touchRecent(id) {
    const hit = state.recents.find(r => r.id === id);
    if (!hit) return;
    hit.at = Math.max(...state.recents.map(r => r.at)) + 1;
    /* A parked session in recents is RESUMABLE, not just a bookmark — which
       is the whole reason one-session-at-a-time costs nothing. Resuming
       parks whatever is open, by the same rule. */
    if (hit.kind === 'session') {
      const title = hit.title;
      state.recents = state.recents.filter(r => r !== hit);
      addTile(hit.id, title, 'session');
      return;
    }
    renderRecents();
  }

  // ---- RENDER: TILES ----
  function renderTiles() {
    if (state.tiles.length === 0) {
      canvas.innerHTML = `
        <div class="empty-slate">
          <!-- Arch drops you at a TTY, not at a window manager with one app in
               it. So the first screen is the ASSISTANT, full canvas — not a
               menu of things to open. The rails are empty on purpose; the
               operator builds the workspace by asking for it. As soon as
               anything is open the assistant recedes to its rail band. -->
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><rect x="8" y="8" width="8" height="8"/></svg>
          <h2>What do you need?</h2>
          <p>Nothing is open and nothing is pinned. Describe the work and this
             builds the workspace for it — or open something yourself.</p>
          <div style="width:min(520px,90%);">
            <div class="composer" style="border:1px solid var(--border-hud);">
              <div class="composer-wrap">
                <textarea id="slateAsk" placeholder="Unbox the UPS delivery that landed this morning\u2026" rows="1"></textarea>
              </div>
              <button class="btn btn-icon" title="Ask" onclick="App.toggleTool('ai')">
                <svg width="14" height="14"><use href="#icon-send"/></svg>
              </button>
            </div>
          </div>
          <div class="empty-slate-actions">
            <button class="btn" onclick="App.addTile('packing','Packing','session')">Start packing session</button>
            <button class="btn" onclick="App.addTile('triage','Triage','table')">Open triage queue</button>
          </div>
          <div class="empty-slate-hints">
            <span><span class="kbd">Ctrl</span> <span class="kbd">K</span> launcher</span>
            <span><span class="kbd">Ctrl</span> <span class="kbd">\\</span> split</span>
            <span><span class="kbd">Ctrl</span> <span class="kbd">W</span> close</span>
          </div>
        </div>`;
      return;
    }

    canvas.innerHTML = '';
    state.tiles.forEach((tile, idx) => {
      const el = document.createElement('div');
      el.className = 'tile' + (tile.focused ? ' focused' : '');
      el.dataset.id = tile.id;
      el.dataset.type = tile.type;
      el.style.flex = tile.flex || '1 1 0';
      el.innerHTML = `
        <div class="tile-header" draggable="true">
          <div class="tile-identity">
            <span class="tile-color" style="background:${tile.color || 'var(--text-muted)'}"></span>
            <span class="tile-title">${escapeHtml(tile.title)}</span>
          </div>
          <span class="tile-type">${tile.type}</span>
          <div class="tile-actions">
            <button class="rail-btn" style="width:20px;height:20px" title="Tile menu"
              onclick="event.stopPropagation();App.showCtx(event,'${tile.id}')">
              <svg width="12" height="12"><use href="#icon-more"/></svg>
            </button>
            <button class="rail-btn tile-close" style="width:20px;height:20px" title="Close this tile and its tab (Ctrl+W)"
              onclick="event.stopPropagation();App.closeTile('${tile.id}')">
              <svg width="12" height="12"><use href="#icon-close"/></svg>
            </button>
          </div>
        </div>
        <div class="tile-body">${tileBody(tile)}</div>
      `;
      /* FOCUS FOLLOWS THE MOUSE — sloppy focus, the same rule as
         Hyprland's `follow_mouse = 1` and every tiling WM that has it.
         Entering the tile focuses it; no click is spent on saying "this
         one". mousedown is kept for touch, where there is no pointer to
         follow and a tap has to do the same job. */
      el.addEventListener('mouseenter', () => focusTile(tile.id));
      el.addEventListener('mousedown', () => focusTile(tile.id));
      el.addEventListener('contextmenu', e => { e.preventDefault(); showCtx(e, tile.id); });

      /* Drag reorder — the point here is that .dragging and
         .snap-target are visibly DIFFERENT from .focused and :hover.
         Four facts, four treatments, and none of them move anything. */
      const head = el.querySelector('.tile-header');
      head.addEventListener('dragstart', e => {
        state.dragId = tile.id;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', tile.id);
      });
      head.addEventListener('dragend', () => {
        state.dragId = null;
        document.querySelectorAll('.tile').forEach(t => t.classList.remove('dragging','snap-target'));
      });
      el.addEventListener('dragover', e => {
        if (!state.dragId || state.dragId === tile.id) return;
        e.preventDefault();
        el.classList.add('snap-target');
      });
      el.addEventListener('dragleave', () => el.classList.remove('snap-target'));
      el.addEventListener('drop', e => {
        e.preventDefault();
        el.classList.remove('snap-target');
        if (!state.dragId || state.dragId === tile.id) return;
        const from = state.tiles.findIndex(t => t.id === state.dragId);
        const to = state.tiles.findIndex(t => t.id === tile.id);
        if (from < 0 || to < 0) return;
        const [moved] = state.tiles.splice(from, 1);
        state.tiles.splice(to, 0, moved);
        state.dragId = null;
        renderTiles();
      });

      if (idx < state.tiles.length - 1) {
        const handle = document.createElement('div');
        handle.className = 'tile-split-handle';
        handle.title = 'Drag to resize';
        el.appendChild(handle);
      }
      canvas.appendChild(el);
    });
    renderPipeline();
  }

  /* Focus is a CLASS TOGGLE, never a re-render. It used to call
     renderTiles(), which rebuilds every tile's innerHTML — tolerable when a
     click triggered it, ruinous now that crossing a tile does: a full
     rebuild would throw away a half-typed note, reset every tile's scroll
     position, and re-lay out both tables on every sweep of the pointer.
     Nothing about which tile has focus needs new markup. */
  function focusTile(id) {
    if (state.tiles.find(t => t.id === id && t.focused)) return;
    state.tiles.forEach(t => {
      t.focused = (t.id === id);
      const el = canvas.querySelector('.tile[data-id="' + t.id + '"]');
      if (el) el.classList.toggle('focused', t.focused);
    });
  }

  function tileBody(tile) {
    /* MANAGER — the staff list. Renders from heartbeats only: no event
       bodies cross the wire to draw this. */
    if (tile.tab === 'staff') {
      return `
        <table class="data-table">
          <thead><tr>
            <th class="col-xs"></th>
            <th class="col-s">staff</th>
            <th class="col-m">session</th>
            <th class="col-s">type</th>
            <th class="col-s">stage</th>
            <th class="col-xs">ver</th>
            <th>last event</th>
            <th class="col-xs">today</th>
          </tr></thead>
          <tbody>
            ${state.staff.map(p => `<tr onclick="App.openStaffTrail('${p.id}')" style="cursor:pointer" title="Open ${escapeHtml(p.name)}'s session replay">
              <td><span class="status-dot ${p.live ? 'ok' : 'warn'}"></span></td>
              <td>${escapeHtml(p.name)}</td>
              <td>${escapeHtml(p.session)}</td>
              <td class="mono">${p.type}</td>
              <td>${p.stage}</td>
              <td class="mono" data-ver="${p.id}">${p.version}</td>
              <td class="mono">${escapeHtml(p.lastEvent)}</td>
              <td class="mono">${p.today}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div style="margin-top:10px;font-size:11px;color:var(--text-muted);">
          Live rows tick <span class="mono">ver</span> as mutations land. The list carries
          heartbeats only — opening a staffer fetches their <span class="mono">ops_events</span> page.
        </div>
      `;
    }

    /* MANAGER — one staffer's session replay. Spined on STAGE today; the
       procedure STEP slots in as a finer level once procedures exist. */
    if (tile.tab.startsWith('trail:')) {
      const who = tile.tab.slice(6);
      const person = state.staff.find(p => p.id === who);
      const tr = state.trail[who];
      if (!tr) return `<div style="color:var(--text-muted);padding:20px;font-size:12px;">No recorded trail for ${escapeHtml(person?.name || who)} yet.</div>`;
      const VERB = { create:'badge-success', update:'badge-accent', delete:'badge-danger' };
      return `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="badge badge-accent">${escapeHtml(tr.type)}</span>
            <span style="font-weight:600;">${escapeHtml(person?.name || who)}</span>
            <span class="mono">${escapeHtml(tr.session)}</span>
            <span class="session-state">${escapeHtml(tr.status)}</span>
            <span class="mono" style="margin-left:auto;">ver ${person?.version ?? 0}</span>
          </div>
          ${tr.groups.map(g => `
            <div>
              <div class="recent-band-label" style="display:block;padding:2px 0 4px;border-bottom:1px solid var(--border-strong);">${g.stage} \u00b7 ${g.events.length} events</div>
              <table class="data-table" style="margin-top:4px;">
                <tbody>
                  ${g.events.map(e => `<tr>
                    <td class="col-s mono">${e.t}</td>
                    <td class="col-xs"><span class="badge ${VERB[e.verb]}">${e.verb}</span></td>
                    <td class="col-s mono">${e.entity}</td>
                    <td>${escapeHtml(e.detail)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>`).join('')}
          <div style="font-size:11px;color:var(--text-muted);">
            Who \u00b7 what \u00b7 when come from <span class="mono">ops_events</span> columns.
            <b>Why</b> is deferred \u2014 stage carries intent today; procedure step ids will carry it exactly.
          </div>
        </div>
      `;
    }

    /* SETTINGS IS A TILE, not a modal and not a page. It is a view of data
       you edit, so K1 puts it in a table tile — which means it tiles beside
       the thing you are adjusting and you watch the change land live. */
    if (tile.tab === 'settings') {
      const seg = (key, val, label) =>
        `<span class="${state.prefs[key]===val?'active':''}" onclick="App.setPref('${key}','${val}')">${label}</span>`;
      const sw = (name) => `<button class="btn btn-sm" style="border-color:${ACCENTS[name].light};color:${ACCENTS[name].light};${state.prefs.accent===name?'font-weight:700':''}"
        onclick="App.setPref('accent','${name}')">${name}${state.prefs.accent===name?' \u00b7':''}</button>`;
      const fs = DENSITY[state.prefs.density].floorScale;
      return `
        <div style="display:flex;flex-direction:column;gap:16px;max-width:620px;">
          <div>
            <div class="recent-band-label" style="display:block;padding:0 0 4px;">Arrangement \u2014 yours, unrestricted</div>
            <div style="font-size:11px;color:var(--text-muted);line-height:1.5;margin-bottom:10px;">
