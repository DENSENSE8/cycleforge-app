              Per staff, per org. Nothing here is bounded, because none of it changes what
              anything <b>means</b>. An unpinned tool is not hidden \u2014 it is one
              <span class="kbd">Ctrl</span> <span class="kbd">K</span> away in the launcher.
            </div>

            <table class="data-table">
              <thead><tr><th class="col-xs"></th><th class="col-s">tool</th><th class="col-s">scope</th><th class="col-s">class</th><th class="col-s">keybind</th><th class="col-s">place</th></tr></thead>
              <tbody>
                ${TOOLS.filter(t => t.scope !== 'agent').map(t => {
                  const pinned = state.pinnedTools.includes(t.key);
                  const idx = state.pinnedTools.indexOf(t.key);
                  return `<tr>
                    <td><span class="status-dot ${pinned ? 'ok' : 'info'}" title="${pinned ? 'pinned' : 'launcher only'}"></span></td>
                    <td>${t.label}</td>
                    <td class="mono" style="font-size:10px;">${t.scope}</td>
                    <td class="mono" style="font-size:10px;">${t.cls}</td>
                    <td><input value="${state.keybinds['tool.'+t.key] || ''}" placeholder="Ctrl+\u2026"
                        onchange="App.setKeybind('tool.${t.key}', this.value)"
                        style="width:76px;border:1px solid var(--border-strong);background:var(--surface-containerLowest);color:var(--text-primary);font:inherit;font-size:10px;font-family:var(--font-mono);padding:1px 4px;outline:none;"></td>
                    <td style="white-space:nowrap;">
                      <button class="btn btn-sm" onclick="App.togglePin('${t.key}')">${pinned ? 'Unpin' : 'Pin'}</button>
                      ${pinned ? `<button class="btn btn-sm" ${idx===0?'disabled style="opacity:.4"':''} onclick="App.movePin('${t.key}',-1)">\u2191</button>
                                  <button class="btn btn-sm" ${idx===state.pinnedTools.length-1?'disabled style="opacity:.4"':''} onclick="App.movePin('${t.key}',1)">\u2193</button>` : ''}
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
            ${state.keybindError ? `<div style="margin-top:6px;font-size:11px;color:var(--text-danger);">${escapeHtml(state.keybindError)}</div>` : ''}
            <div style="margin-top:6px;font-size:11px;color:var(--text-muted);line-height:1.5;">
              A chord must carry a modifier. A wedge scanner emits keystrokes, so a bare key
              is a scan waiting to fire a tool \u2014 the same hazard the wedge detector (I3)
              exists for. Collisions are refused, never silently shadowed.<br>
              The <b>Assistant</b> is not in this list: it is the rail's fixed head, structural
              like the add button, so it cannot be unpinned or reordered.
            </div>
          </div>

          <div>
            <div class="recent-band-label" style="display:block;padding:0 0 4px;">Comfort \u2014 yours, bounded</div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <span style="width:92px;font-size:var(--sz-xs);">Density</span>
              <div class="composer-toggle">${seg('density','compact','compact')}${seg('density','default','default')}${seg('density','roomy','roomy')}</div>
              <span class="mono" style="font-size:10px;color:var(--text-muted);">floors \u00d7${fs.toFixed(2)}</span>
            </div>
            <div style="font-size:11px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;">
              One scale, not separate padding knobs. The tile floors were measured against a
              density, so they scale with it \u2014 session ${Math.round(784*fs)}px, table
              ${Math.round(520*fs)}px. Separate knobs would be an untested combination with
              silently wrong floors.
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <span style="width:92px;font-size:var(--sz-xs);">Frame radius</span>
              <input type="range" min="0" max="16" step="1" value="${state.prefs.radius}"
                oninput="App.setPref('radius', this.value)" style="flex:1;max-width:200px;">
              <span class="mono">${state.prefs.radius}px</span>
            </div>
            <div style="font-size:11px;color:var(--text-muted);line-height:1.5;margin-bottom:12px;">
              Safe to expose <i>because</i> the control radius tokens were deleted. Radius
              appears in exactly one place \u2014 the workspace frame \u2014 so this
              parameterizes that place instead of reopening the question.
            </div>

            <div style="display:flex;align-items:center;gap:10px;">
              <span style="width:92px;font-size:var(--sz-xs);">Accent</span>
              <div style="display:flex;gap:4px;flex-wrap:wrap;">${Object.keys(ACCENTS).map(sw).join('')}</div>
            </div>
          </div>

          <div>
            <div class="recent-band-label" style="display:block;padding:0 0 4px;">Meaning \u2014 locked</div>
            <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px;">
              ${[['ok','packed / on target'],['warn','pending / near limit'],['err','damaged / over'],['info','received']].map(([k,l])=>
                `<span style="display:flex;align-items:center;gap:5px;font-size:11px;"><span class="status-dot ${k}"></span>${l}</span>`).join('')}
            </div>
            <div style="font-size:11px;color:var(--text-muted);line-height:1.5;">
              Not a preference. Semantic colour is a <b>shared vocabulary</b>: if two staff
              recolour their own, they read the same screen differently, and a lead walking
              the floor cannot read anyone's. Org-level only, and only for accessibility \u2014
              never taste.
            </div>
          </div>
        </div>`;
    }

    /* THE EXCEPTIONS QUEUE — a TABLE, not a session. The unit of work is the
       ROW: each fix commits on its own, so two operators can work the same
       queue, a crash loses nothing, and there is no "unsaved changes" dialog
       on a warehouse floor. */
    if (tile.tab === 'orders-exceptions') {
      const bad = state.importRows.filter(r => r.err);
      if (!bad.length) return `<div style="color:var(--text-muted);padding:20px;font-size:12px;">Nothing unresolved. The sync placed every row.</div>`;
      return `
        <table class="data-table">
          <thead><tr><th class="col-xs"></th><th class="col-s">sku</th><th class="col-xs">qty</th><th class="col-s">bin</th><th>problem</th><th class="col-s">source</th><th class="col-s"></th></tr></thead>
          <tbody>
            ${bad.map(r => `<tr>
              <td><span class="status-dot err"></span></td>
              <td class="mono">${r.sku}</td><td class="mono">${r.qty}</td><td class="mono">${r.bin || '\u2014'}</td>
              <td style="color:var(--text-danger)">${r.err}</td>
              <td class="mono" style="font-size:10px;">${r.src || 'sync'}</td>
              <td><button class="btn btn-sm" onclick="App.importFix('${r.sku}')">Resolve</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div style="margin-top:10px;font-size:11px;color:var(--text-muted);">
          One queue, every producer \u2014 cron, webhook and manual upload all land here.
          Each Resolve commits on its own; nothing is staged.
        </div>`;
    }

    if (tile.type === 'table') {
      /* This is what a work queue looks like once it stops being a rail:
         real columns, a sort affordance, a selection column and room for
         the identity facts the rail's peek card had to hide. */
      const rows = [
        ['ok',   'C-8842-A', 'UPS',   '1Z999AA10123456784', 'B', 'unbox',   '4m'],
        ['ok',   'C-8839-B', 'FedEx', '7742 8891 0021',     'A', 'unbox',   '11m'],
        ['warn', 'C-8830-K', 'USPS',  '9410 8036 9930 41',  'C', 'triage',  '38m'],
        ['err',  'C-8827-D', 'UPS',   '1Z999AA10987654321', '—', 'triage',  '1h 02m'],
        ['info', 'C-8821-M', 'DHL',   'JVGL0999 8812 34',   'B', 'testing', '2h 14m'],
        ['ok',   'C-8814-P', 'FedEx', '7742 8890 5510',     'A', 'packing', '3h 40m'],
      ];
      return `
        <table class="data-table">
          <thead><tr>
            <th class="col-xs"></th>
            <th class="col-s">carton</th>
            <th>carrier</th>
            <th class="col-m">tracking</th>
            <th class="col-xs">gr</th>
            <th class="col-s">stage</th>
            <th class="col-s">age</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `<tr>
              <td><span class="status-dot ${r[0]}"></span></td>
              <td class="mono">${r[1]}</td>
              <td>${r[2]}</td>
              <td class="mono">${r[3]}</td>
              <td class="mono">${r[4]}</td>
              <td>${r[5]}</td>
              <td class="mono">${r[6]}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      `;
    }
    /* TASK SESSION — one container, several VIEWS. Step `source` renders a
       FORM; step `triage` renders a GRID. Neither is a different kind of
       object; both are renderings of one session's current step, and the
       staged rows survive closing the tile because they live in the
       session's state. */
    if (tile.type === 'session' && tile.sessionKind === 'task') {
      const step = state.importStep;
      const i = FBA_STEPS.indexOf(step);
      const picked = state.fbaPicked;
      const spine = `
        <div class="tile-spine">
          <div class="tile-spine-identity">
            <span class="session-state">${picked ? 'building' : 'open'}</span>
            <span style="font-weight:600;font-size:var(--sz-sm);">${escapeHtml(tile.title)}</span>
            <span class="badge badge-accent">task</span>
            <span class="mono">${picked} units selected</span>
          </div>
          <div class="pipeline">
            ${FBA_STEPS.map((sName, idx) => `<div class="pipeline-step ${idx<i?'done':idx===i?'current':''}" style="flex:1;justify-content:center;">
              <div class="pipeline-mark"></div><span>${sName}</span></div>`).join('')}
          </div>
        </div>`;

      if (step === 'select') {
        return spine + `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="font-size:11px;color:var(--text-secondary);line-height:1.5;">
              The unit of work here is the <b>shipment</b>, not the row. Half a
              shipment is not a thing \u2014 so the selection has to survive closing
              this tile, and that is what makes it a session rather than a table.
            </div>
            <table class="data-table">
              <thead><tr><th class="col-xs"></th><th class="col-s">serial</th><th class="col-s">sku</th><th class="col-s">bin</th></tr></thead>
              <tbody>
                ${['SN-7742-A','SN-7742-B','SN-9912-D','SN-2210-F'].map((sn,ix) => `<tr>
                  <td><span class="status-dot ${ix < picked ? 'ok' : 'info'}"></span></td>
                  <td class="mono">${sn}</td><td class="mono">SKU-99${21+ix}</td><td class="mono">B-04-${ix+1}</td>
                </tr>`).join('')}
              </tbody>
            </table>
            <div style="display:flex;gap:8px;">
              <button class="btn" onclick="App.fbaPick(1)">Select one more</button>
              <button class="btn btn-primary" ${picked?'':'disabled style="opacity:.45;cursor:not-allowed"'} onclick="App.importStep('box')">Box ${picked} units</button>
            </div>
          </div>`;
      }
      if (step === 'box') {
        return spine + `
          <div style="display:flex;flex-direction:column;gap:8px;">
            <div class="session-field"><label>Carton</label><input type="text" value="FBA-BOX-0041" readonly style="color:var(--text-muted)"></div>
            <div class="session-field"><label>Weight</label><input type="text" value="14.2 lb"></div>
            <div style="display:flex;gap:8px;margin-top:4px;">
              <button class="btn" onclick="App.importStep('select')">Back</button>
              <button class="btn btn-primary" onclick="App.importStep('label')">Generate label</button></div>
          </div>`;
      }
      if (step === 'label') {
        return spine + `
          <div style="text-align:center;padding:16px 0;">
            <div class="mono" style="font-size:var(--sz-lg);">FBA15K9XQ2M</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Zebra-ZT411 \u00b7 4x6</div>
            <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
              <button class="btn" onclick="App.importStep('box')">Back</button>
              <button class="btn btn-primary" onclick="App.importStep('ship')">Confirm shipped</button></div>
          </div>`;
      }
      return spine + `
        <div style="text-align:center;padding:24px 0;">
          <div style="font-size:var(--sz-lg);font-weight:600;">Shipment closed</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">${picked} units \u00b7 one ops_event per unit \u00b7 actor_kind = operator</div>
        </div>`;
    }

    if (tile.type === 'session') {
      return `
        <div style="display:flex;flex-direction:column;gap:12px;height:100%;">
          <!-- THE SPINE — identity, stage, carton. On the object, not in the beam. -->
          <div class="tile-spine">
            <div class="tile-spine-identity">
              <span class="session-state ${state.sessionState==='armed'?'':state.sessionState}">${state.sessionState}</span>
              <span style="font-weight:600;font-size:var(--sz-sm);">${escapeHtml(state.sessionName)}</span>
              <!-- The carton itself is a BENCH fact and lives in the beam (B21).
                   What stays here is the session's PROGRESS through it, which is
                   the one part of that string the session actually owns. -->
              <span class="mono">unit 3 of 12</span>
            </div>
            <div class="pipeline" id="tilePipeline"></div>
          </div>
          <div style="padding:16px;border:1.5px dashed var(--border-strong);text-align:center;color:var(--text-muted);">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-family:var(--font-condensed);font-weight:700;color:var(--text-secondary);">Awaiting scan</div>
            <div style="margin-top:6px;">Scan a unit to pack</div>
            <div style="font-size:11px;margin-top:6px;">Next expected: <span class="mono">SN-8842-X</span></div>
          </div>
          <div style="font-size:11px;color:var(--text-muted)">Last scan landed in this tile · <span class="kbd">Enter</span> to confirm</div>
          <div class="composer" style="margin-top:auto;margin-left:-12px;margin-right:-12px;margin-bottom:-12px;">
            <div class="composer-wrap">
              <div class="composer-toggle">
                <span class="active">internal</span>
                <span>public</span>
              </div>
              <textarea placeholder="Add a note…" rows="1"></textarea>
            </div>
            <button class="btn btn-icon" title="Send">
              <svg width="14" height="14"><use href="#icon-send"/></svg>
            </button>
          </div>
        </div>
      `;
    }
    return '<div style="color:var(--text-muted);font-size:12px;padding:20px;">Tile content</div>';
  }

  // ---- RENDER: TOOL PANEL ----
  /* The rail is rendered from the registry, banded by scope. A session band
     with no available tools renders NOTHING — a heading over an empty band
     spends the rail's scarcest resource on saying there is nothing to say. */
  function renderToolRail() {
    const paint = (host, list, bandLabel) => {
      if (!host) return;
      host.innerHTML = '';
      if (!list.length) return;
      if (bandLabel) {
        const lbl = document.createElement('div');
        lbl.className = 'recent-band-label';
        lbl.textContent = bandLabel;
        host.appendChild(lbl);
      }
      list.forEach(t => {
        const el = document.createElement('button');
        el.className = 'rail-btn' + (state.openTool === t.key && state.toolPanelOpen ? ' active' : '');
        el.title = `${t.label} \u2014 ${t.scope} \u00b7 ${t.cls}`;
        el.dataset.tool = t.key;
        el.onclick = () => toggleTool(t.key);
        const badge = t.key === 'ai' && state.agentQueue.length
          ? `<span class="rail-badge">${state.agentQueue.length}</span>` : '';
        el.innerHTML = iconFor(t.icon, 15) + `<span class="rail-btn-label">${t.label}</span>` + badge;
        host.appendChild(el);
      });
    };
    /* The rail shows the FIXED HEAD, then only what the operator PINNED,
       in their order. An unpinned tool is not hidden — it is one Ctrl+K away
       in the launcher, which is the one index. */
    /* The rail does NOT repeat the beam's pins. One pin surface, and it is
       the top-right cluster. The rail keeps discovery (add/search) and the
       contextual band; the beam keeps the fixed set. */
    paint($('toolsGlobal'), [], null);
    paint($('toolsSession'), TOOLS.filter(t => t.scope === 'session' && toolAvailable(t)), 'Session');
  }

  function renderTool() {
    /* The rail is painted from the registry, so the active tint is read off
       `data-tool` — the hand-kept btnTool* id map it replaced pointed at
       elements that no longer exist, and threw on every panel open. */
    document.querySelectorAll('.rail.right .rail-btn[data-tool]').forEach(b => {
      b.classList.toggle('active', state.toolPanelOpen && b.dataset.tool === state.openTool);
    });

    const big = 'font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;font-feature-settings:\'tnum\' 1;font-family:var(--font-mono);';

    if (state.openTool === 'import') {
      toolPanelTitle.textContent = 'Import orders';
      toolPanelBody.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:11px;color:var(--text-secondary);line-height:1.5;">
            Orders sync on a schedule. This is the manual path \u2014 a fallback when the
            sync is down, or a one-off file. Either way the rows land in the same
            exceptions queue.
          </div>
          <div class="session-field"><label>Channel</label><input type="text" value="eBay" readonly style="color:var(--text-muted)"></div>
          <div class="session-field"><label>File</label><input type="text" value="orders-2026-08-22.csv" readonly style="color:var(--text-muted)"></div>
          <button class="btn btn-primary" onclick="App.runImport()">Import ${state.importRows.length} rows</button>
          <div style="font-size:11px;color:var(--text-muted);">
            Last sync 04:12 \u00b7 <span class="mono">${state.importRows.filter(r=>r.err).length}</span> unresolved
          </div>
        </div>`;
      toolPanelFooter.textContent = 'Actuator \u00b7 single act \u00b7 nothing staged';
    } else if (state.openTool === 'ai') {
      toolPanelTitle.textContent = 'Assistant';
      toolPanelBody.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${state.agentQueue.length ? `
            <div>
              <div class="recent-band-label" style="display:block;padding:0 0 4px;">Awaiting review \u00b7 ${state.agentQueue.length}</div>
              ${state.agentQueue.map(m => `
                <div style="border:1px solid var(--border-strong);padding:6px;margin-bottom:4px;">
                  <div style="font-weight:600;">${escapeHtml(m.summary)}</div>
                  <div class="mono" style="font-size:10px;color:var(--text-muted);">${m.kind}</div>
                  <div style="font-size:11px;color:var(--text-secondary);margin-top:3px;">${escapeHtml(m.why)}</div>
                  <div style="display:flex;gap:4px;margin-top:6px;">
                    <button class="btn btn-sm btn-primary" onclick="App.agentApply('${m.id}')">Apply</button>
                    <button class="btn btn-sm" onclick="App.agentDismiss('${m.id}')">Dismiss</button>
                  </div>
                </div>`).join('')}
            </div>` : `<div style="color:var(--text-muted);text-align:center;padding:12px 0;">Nothing awaiting review</div>`}
          <div>
            <div class="recent-band-label" style="display:block;padding:0 0 4px;">Applied today \u00b7 ${state.agentApplied}</div>
            <button class="btn btn-sm" onclick="App.agentUndo()">Undo last</button>
          </div>
          <div class="composer" style="margin:0;border:1px solid var(--border-strong);">
            <div class="composer-wrap">
              <textarea placeholder="Ask, or tell it what to set up\u2026" rows="1"></textarea>
            </div>
            <button class="btn btn-icon" title="Send"><svg width="14" height="14"><use href="#icon-send"/></svg></button>
          </div>
        </div>`;
      toolPanelFooter.textContent = 'Writes land in agent_mutations \u00b7 every row reversible';
    } else if (state.openTool === 'pairing') {
      /* Pairing is an operation, so it lives here and not in the beam. */
      toolPanelTitle.textContent = 'Pairing';
      toolPanelBody.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div class="session-field"><label>Tracking number</label><input type="text" value="1Z999AA10123456784"></div>
          <div style="text-align:center;color:var(--text-muted);font-size:16px;">&#8597;</div>
          <div class="session-field"><label>Serial</label><input type="text" placeholder="Scan serial…"></div>
          <button class="btn btn-primary" style="margin-top:4px;">Commit pair</button>
        </div>`;
      toolPanelFooter.textContent = 'Operation — not header chrome';
    } else if (state.openTool === 'timer') {
      toolPanelTitle.textContent = 'Timer';
      toolPanelBody.innerHTML = `
        <div style="text-align:center;padding:10px 0;">
          <div style="${big}">${fmtTime(state.timer)}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.12em;">Session elapsed</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;">
          <button class="btn" onclick="App.toggleTimer()">${state.timerRunning?'Pause':'Resume'}</button>
          <button class="btn" onclick="App.resetTimer()">Reset</button>
        </div>
        <div style="margin-top:14px;">
          <div class="recent-band-label" style="display:block;padding:0 0 4px;">Header readout</div>
          <div class="composer-toggle" style="align-self:stretch;">
            <span class="${state.faceMode==='pace'?'active':''}"    onclick="App.setFaceMode('pace')">pace</span>
            <span class="${state.faceMode==='elapsed'?'active':''}" onclick="App.setFaceMode('elapsed')">elapsed</span>
            <span class="${state.faceMode==='off'?'active':''}"     onclick="App.setFaceMode('off')">off</span>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.45;">
            <b>pace</b> shows the target and colours when you are near or over it.
            <b>elapsed</b> shows the clock only and is never coloured.
            <b>off</b> hides the readout.<br>
            This is a display setting for you alone. Work is recorded either way \u2014
            it changes what you see, not what is measured.
          </div>
        </div>`;
      toolPanelFooter.textContent = 'Auto-started when session opened';
    } else if (state.openTool === 'stopwatch') {
      toolPanelTitle.textContent = 'Stopwatch';
      const total = Math.floor(state.stopwatch);
      const m = Math.floor(total/60).toString().padStart(2,'0');
      const s = (total%60).toString().padStart(2,'0');
      const ms = Math.floor((state.stopwatch%1)*100).toString().padStart(2,'0');
      toolPanelBody.innerHTML = `
        <div style="text-align:center;padding:10px 0;">
          <div style="${big}">${m}:${s}.${ms}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.12em;">Lap timing</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;">
          <button class="btn btn-primary" onclick="App.toggleSw()">${state.swRunning?'Stop':'Start'}</button>
          <button class="btn" onclick="App.resetSw()">Reset</button>
        </div>`;
      toolPanelFooter.textContent = 'User-pinned tool';
    } else if (state.openTool === 'photos') {
      toolPanelTitle.textContent = 'Photo library';
      toolPanelBody.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:24px 0;">12 photos<br><span style="font-size:11px;">Drag onto a tile to attach</span></div>`;
      toolPanelFooter.textContent = 'Auto-summoned on unit scan';
    } else if (state.openTool === 'manuals') {
      toolPanelTitle.textContent = 'Manuals';
      toolPanelBody.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:24px 0;">3 manuals linked<br><span style="font-size:11px;">Auto-summoned on scan</span></div>`;
      toolPanelFooter.textContent = 'Testing stage only';
    } else if (state.openTool === 'printer') {
      toolPanelTitle.textContent = 'Label printer';
      toolPanelBody.innerHTML = `<div style="color:var(--text-muted);text-align:center;padding:24px 0;">Printer: Zebra-ZT411<br><span style="font-size:11px;">Paired · 42 labels today</span></div>`;
      toolPanelFooter.textContent = 'USB/serial — workstation bound';
    } else if (state.openTool === 'calc') {
      toolPanelTitle.textContent = 'Calculator';
      const keys = ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'];
      toolPanelBody.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;">
          ${keys.map(k => `<button class="btn${k==='='?' btn-primary':''}" style="padding:10px 4px">${k}</button>`).join('')}
        </div>`;
      toolPanelFooter.textContent = 'Pinned tool';
    }
    toolPanel.classList.toggle('open', state.toolPanelOpen);
    renderToolRail();
  }

  // ---- RENDER: PIPELINE (segment 1 of the context line) ----
  /* Scan type IS the process stage, so the stage strip is part of what
     the session is — it renders inside the context line, not in a
     header zone of its own. */
  function renderPipeline() {
    const el = $('tilePipeline');
    if (!el) return;
    el.innerHTML = state.pipeline.map((stage, i) => {
      let cls = '';
      if (i < state.currentStage) cls = 'done';
      else if (i === state.currentStage) cls = 'current';
      const label = stage === 'ready' ? 'ready to pack' : stage;
      return `<div class="pipeline-step ${cls}"><div class="pipeline-mark"></div><span>${label}</span></div>`;
    }).join('');
  }

  /* The beam carries the session identity ONLY while the session tile is not
     on screen. That is the one case the tile cannot cover: the canvas scrolls
     horizontally below its floors, and the beam cannot scroll away. */
  /* No beam fallback for session identity. Two reasons it is not needed:
     the session tile cannot be fully scrolled away at these floors (max
     overflow is smaller than the tile), and "is anything armed / where does
     my scan land" is already answered permanently by the scan-armed cell in
     the corner cluster — it reads 'no session' and 'parked' in exactly the
     states a fallback would have covered. */

  // ---- RENDER: SESSION STATE ----
  /* The face reads against the target for the CURRENT STAGE. No session, no
     target — the slot goes muted rather than lying with a zero. */
  function renderFace() {
    const face = $('headerFace');
    if (!face) return;

    if (state.faceMode === 'off') { face.style.display = 'none'; return; }
    face.style.display = '';

    const armed = state.sessionState === 'armed';
    const paced = state.faceMode === 'pace';
    const stage = state.pipeline[state.currentStage];
    const target = armed && paced ? state.stageTargets[stage] : null;
    const mmss = t => `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`;

    $('faceElapsed').textContent = armed ? mmss(state.timer % 3600) : '--:--';
    /* In `elapsed` mode the target half is not blanked — it is REMOVED, so the
       slot narrows and stops implying a hidden number. */
    $('faceTarget').textContent = target ? mmss(target) : '';
    face.querySelector('.face-sep').style.display = target ? '' : 'none';
    face.style.width = paced ? '128px' : '78px';

    let cls = 'idle';
    if (armed && target) {
      const r = state.timer / target;
      cls = r >= 1 ? 'over' : r >= 0.8 ? 'near' : 'on-target';
    }
    /* `elapsed` mode is NEVER coloured. Colour is the verdict, and this mode
       exists precisely for the operator who wants the clock without one. */
    face.className = 'header-face ' + (paced ? cls : 'idle');
    face.title = paced
      ? 'Session elapsed against the target for this task type. Click for the timer.'
      : 'Session elapsed. No target shown. Click for the timer.';
  }

  function setFaceMode(mode) {
    state.faceMode = mode;
    renderFace();
    if (state.openTool === 'timer' && state.toolPanelOpen) renderTool();
  }

  function renderSession() {
    const named = state.sessionName && state.sessionName.trim().length > 0;

    zoneSession.className = 'zone-session ' + (state.sessionState === 'armed' ? '' : state.sessionState);
    renderFace();
    $('sessionValue').textContent =
      state.sessionState === 'armed' ? (named ? state.sessionName : 'Unnamed session')
      : state.sessionState === 'parked' ? 'parked — no target'
      : state.sessionState === 'ended' ? 'no session'
      : 'scan blocked';
  }

  // ---- ACTIONS ----
  /* Instant. A rail that tweens its width holds the canvas hostage for
     the length of the tween and hands back nothing during it. */
  function toggleRail(side) {
    const rail = $(side + 'Rail');
    const expanded = rail.classList.toggle('expanded');
    if (side === 'left') state.leftExpanded = expanded;
    else state.rightExpanded = expanded;
    renderSettings();
  }

  function toggleTool(tool) {
    if (state.openTool === tool && state.toolPanelOpen) {
      state.toolPanelOpen = false;
    } else {
      state.openTool = tool;
      state.toolPanelOpen = true;
    }
    renderTool();
  }

  function closeToolPanel() {
    state.toolPanelOpen = false;
    renderTool();
  }

  function focusTab(tabId) {
    state.activeTab = tabId;
    renderTabs();
    state.tiles.forEach(t => t.focused = (t.tab === tabId));
    if (!state.tiles.some(t => t.tab === tabId)) {
      const tab = state.tabs.find(t => t.id === tabId);
      if (tab) return addTile(tabId, tab.title, tab.type);
    }
    renderTiles();
  }

  let seq = 0;
  function addTile(tabId, title, type) {
    /* ONE SCAN-SESSION TILE ON THE CANVAS, EVER.
       `ux_work_sessions_armed_scan` already makes two ARMED scan sessions
       impossible in the database. What the DB cannot stop is the UI showing
       two session tiles that look identical while only one owns the wedge —
       and a tile you believe is armed but is not is a mis-scan generator.
       So opening a session PARKS the one that is open and swaps it in.
       Parking is lossless: `work_sessions.state` JSONB holds the draft
       buffers and tile geometry, `status='parked'` is a first-class state,
       and the claim lease exists so a parked session can be resumed — by
       this operator or by a lead. The parked one drops into the recents
       Sessions band, which is how you get back to it. */
    /* S2 is about SCAN sessions. `kind='task'` sessions are N — the schema
       says so explicitly, and they do not own the wedge, so they cannot
       compete for a barcode. Treating every session as exclusive was a bug:
       it made an order import park the packing bench. */
    const sessionKind = SESSION_KINDS[tabId] ?? 'scan';
    if (type === 'session' && sessionKind === 'scan') {
      const openSession = state.tiles.find(t => t.type === 'session' && t.sessionKind === 'scan');
      if (openSession) {
        if (openSession.tab === tabId) {
          /* Re-opening the session that is already on canvas focuses it — and
             RE-ARMS it if it was parked. S4 says parking is lossless and the
             claim lease exists so a parked session can be resumed; a resume
             that leaves the arm on the floor would mean the operator is back
             at the bench with nothing owning the wedge. */
          if (state.sessionState !== 'armed') {
            state.sessionState = 'armed';
            renderSession();
            renderTool();
          }
          focusTile(openSession.id);
          return;
        }
        parkSessionTile(openSession);
      }
    }
    /* ONE APPLICATION PER TILE, AND ONE TILE PER APPLICATION.
       Opening something already on the canvas focuses it instead of dealing
       a second copy. Two tiles of one page means two places for the same
       state to be edited and no way to tell which one you are looking at —
       pressing the gear twice must not produce two settings pages. Splitting
       is the deliberate exception and goes through ctxSplit, which pushes
       its own tile and never comes through here. */
    const already = state.tiles.find(t => t.tab === tabId);
    if (already) {
      focusTile(already.id);
      state.activeTab = tabId;
      renderTabs();
      return;
    }

    const id = 't' + (++seq) + '-' + tabId;
    const existingTab = state.tabs.find(t => t.id === tabId);
    const color = existingTab?.color || PALETTE[state.tiles.length % PALETTE.length];
    state.tiles.push({ id, tab: tabId, title, color, icon: type==='table'?'table':'box', type, sessionKind, focused: true });
    state.tiles.forEach(t => t.focused = (t.id === id));
    state.activeTab = tabId;
    if (type === 'session' && sessionKind === 'scan') {
      state.sessionName = title;
      state.sessionState = 'armed';
      state.currentStage = Math.max(0, state.pipeline.indexOf(tabId));
      $('sessionNameInput').value = title;
      renderSession();
      renderPipeline();
    }
    renderTiles();
    if (!existingTab) state.tabs.push({ id: tabId, title, color, icon: type==='table'?'table':'box', type });
    renderTabs();
  }

  /* Park, don't close. The row survives with its state; only the arm and the
     canvas slot are given up. It lands in recents so it is one click back. */
  function parkSessionTile(tile) {
    state.tiles = state.tiles.filter(t => t.id !== tile.id);
    state.tabs = state.tabs.filter(t => t.id !== tile.tab);
    state.recents = state.recents.filter(r => !(r.kind === 'session' && r.id === tile.tab));
    state.recents.push({
      kind: 'session', id: tile.tab, title: tile.title,
      sub: 'parked · state kept', at: Math.max(...state.recents.map(r => r.at)) + 1,
    });
    renderRecents();
  }

  /* Opening a replay is a TABLE tile, not a session — so it never contends
     with the one-scan-session-tile rule, and a manager can hold several open. */
  function openStaffTrail(staffId) {
    const person = state.staff.find(p => p.id === staffId);
    addTile('trail:' + staffId, (person?.name || staffId) + ' \u2014 replay', 'table');
  }

  function importStep(step) { state.importStep = step; renderTiles(); }
  function fbaPick(n) { state.fbaPicked = Math.min(4, state.fbaPicked + n); renderTiles(); }
  function runImport() {
    state.importRows.forEach(r => { if (!r.src) r.src = 'manual'; });
    addTile('orders-exceptions', 'Orders exceptions', 'table');
    renderTool();
  }
  function importFix(sku) {
    const row = state.importRows.find(r => r.sku === sku);
    if (row) { row.bin = 'B-07-1'; row.err = null; }
    renderTiles();
  }

  const DENSITY = {
    compact: { sp2:'6px',  sp3:'9px',  ctrl:'22px', floorScale:0.92 },
    default: { sp2:'8px',  sp3:'12px', ctrl:'26px', floorScale:1.00 },
    roomy:   { sp2:'11px', sp3:'16px', ctrl:'32px', floorScale:1.14 },
  };
  const ACCENTS = {
    blue:   { light:'#1d4ed8', dark:'#60a5fa' },
    teal:   { light:'#0f766e', dark:'#2dd4bf' },
    violet: { light:'#6d28d9', dark:'#a78bfa' },
    amber:  { light:'#a16207', dark:'#fbbf24' },
  };

  function applyPrefs() {
    const r = document.documentElement.style;
    const d = DENSITY[state.prefs.density] ?? DENSITY.default;
    r.setProperty('--sp-2', d.sp2);
    r.setProperty('--sp-3', d.sp3);
    r.setProperty('--control-h', d.ctrl);
    /* Safe to expose BECAUSE F2 deleted the other radius tokens. There is
       exactly one place radius appears, so this parameterizes that place
       rather than reopening the question. */
    r.setProperty('--r-hud', state.prefs.radius + 'px');
    const a = ACCENTS[state.prefs.accent] ?? ACCENTS.blue;
    const dark = document.body.getAttribute('data-theme') === 'dark';
    r.setProperty('--text-accent', dark ? a.dark : a.light);
    r.setProperty('--border-accent', dark ? a.dark : a.light);
    /* The floors move WITH the density — otherwise `roomy` silently makes
       every measured minimum wrong. */
    r.setProperty('--tile-min-session', Math.round(784 * d.floorScale) + 'px');
    r.setProperty('--tile-min-table',   Math.round(520 * d.floorScale) + 'px');
  }

  /* The beam is finite. 8 × 28px = 224px, which still leaves the context
     line ~500px at 1440. The ceiling is enforced with a reason, not trusted. */
  /* The rail is a column, so the ceiling is height, not beam width. At 28px
     a cell, 10 pins is 280px — comfortable above the slack on a 900px rail. */
  const MAX_HEADER_PINS = 10;

  function renderHeaderTools() {
    const host = $('headerTools');
    if (!host) return;
    host.innerHTML = '';
    const items = [
      TOOLS.find(t => t.key === 'ai'),
      ...state.pinnedTools.map(k => TOOLS.find(t => t.key === k)),
    ].filter(Boolean);

    items.forEach((t) => {
      const fixed = t.key === 'ai';
      const el = document.createElement('button');
      el.className = 'cluster-btn rail-btn' + (state.openTool === t.key && state.toolPanelOpen ? ' active' : '');
      el.dataset.pin = t.key;
      el.draggable = !fixed;
      const chord = state.keybinds['tool.' + t.key];
      el.title = `${t.label}${fixed ? ' — fixed head, cannot be unpinned' : ' — drag to reorder · right-click to unpin'}${chord ? ' · ' + chord : ''}`;
      const badge = t.key === 'ai' && state.agentQueue.length
        ? `<span class="rail-badge">${state.agentQueue.length}</span>` : '';
      el.innerHTML = iconFor(t.icon, 15)
        + `<span class="rail-btn-label">${t.label}</span>` + badge
        + (chord ? `<span class="hp-chord">${chord.replace(/^Ctrl\+/i,'^')}</span>` : '');
      el.onclick = () => toggleTool(t.key);
      el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); showPinCtx(e, t.key, fixed); };
      if (!fixed) {
        el.addEventListener('dragstart', ev => {
          state.dragTool = t.key;
          ev.dataTransfer.effectAllowed = 'move';
          ev.dataTransfer.setData('text/plain', t.key);
        });
        el.addEventListener('dragover', ev => { ev.preventDefault(); el.classList.add('drop-before'); });
        el.addEventListener('dragleave', () => el.classList.remove('drop-before'));
        el.addEventListener('drop', ev => {
          ev.preventDefault(); ev.stopPropagation();
          el.classList.remove('drop-before');
          dropPin(state.dragTool, t.key);
        });
      }
      host.appendChild(el);
    });

    host.ondragover = e => { e.preventDefault(); host.classList.add('drop-target'); };
    host.ondragleave = () => host.classList.remove('drop-target');
    host.ondrop = e => { e.preventDefault(); host.classList.remove('drop-target'); dropPin(state.dragTool, null); };
  }

  /* One drop handler for both gestures: from the list it PINS, from inside
     the cluster it REORDERS. `before` is the key to insert ahead of, or null
     for "append". */
  function dropPin(key, before) {
    if (!key) return;
    const cur = state.pinnedTools.indexOf(key);
    if (cur < 0 && state.pinnedTools.length >= MAX_HEADER_PINS) {
      state.pinError = `The rail holds ${MAX_HEADER_PINS} pins. Unpin one first.`;
      state.dragTool = null; renderHeaderTools(); renderToolDrop(); return;
    }
    state.pinError = null;
    if (cur >= 0) state.pinnedTools.splice(cur, 1);
    const at = before ? state.pinnedTools.indexOf(before) : -1;
    if (at >= 0) state.pinnedTools.splice(at, 0, key);
    else state.pinnedTools.push(key);
    state.dragTool = null;
    renderHeaderTools(); renderToolDrop(); renderTool(); renderTiles();
  }

  function renderToolDrop() {
    const host = $('toolDrop');
    if (!host) return;
    host.innerHTML = TOOLS.filter(t => t.key !== 'ai').map(t => {
      const pinned = state.pinnedTools.includes(t.key);
      const chord = state.keybinds['tool.' + t.key] || '';
      return `<button class="row${pinned ? ' is-pinned' : ''}" draggable="true" data-drag="${t.key}"
        oncontextmenu="event.preventDefault();event.stopPropagation();App.showPinCtx(event,'${t.key}',false)"
        onclick="App.toggleTool('${t.key}')">
        ${iconFor(t.icon, 14)}<span>${t.label}</span>
        <span class="mono">${pinned ? 'pinned' : chord || ''}</span>
      </button>`;
    }).join('') + (state.pinError ? `<div style="padding:6px 12px;font-size:11px;color:var(--text-danger);border-top:1px solid var(--border-subtle);">${escapeHtml(state.pinError)}</div>` : '');

    host.querySelectorAll('[data-drag]').forEach(row => {
      row.addEventListener('dragstart', ev => {
        state.dragTool = row.dataset.drag;
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', row.dataset.drag);
      });
    });
  }

  function toggleToolDrop() {
    const host = $('toolDrop');
    renderToolDrop();
    host.classList.toggle('open');
  }

  /* PIN IN LINE. Right-click the icon itself — the control is on the thing
     it controls, not three surfaces away in a settings pane. */
  function showPinCtx(e, key, fixed) {
    const tool = TOOLS.find(t => t.key === key);
    /* An unknown key is a caller bug, not a crash. The registry is the
       authority on what a tool is; anything not in it has no menu. */
    if (!tool) { closeCtx(); return; }
    const pinned = state.pinnedTools.includes(key);
    ctxMenu.innerHTML = fixed
      ? `<button class="context-item" disabled style="opacity:.5;cursor:default">${tool.label} — fixed head</button>`
      : `<button class="context-item" onclick="App.dropPinFromMenu('${key}')">
           ${iconFor(pinned ? 'close' : 'check', 14)} ${pinned ? 'Unpin from rail' : 'Pin to rail'}
         </button>
         <button class="context-item" onclick="App.toggleTool('${key}');App.closeCtx()">
           ${iconFor(tool.icon, 14)} Open ${tool.label}
         </button>`;
    ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px';
    ctxMenu.classList.add('open');
  }

  function dropPinFromMenu(key) {
    if (state.pinnedTools.includes(key)) togglePin(key);
    else dropPin(key, null);
    closeCtx();
  }

  function togglePin(key) {
    const i = state.pinnedTools.indexOf(key);
    if (i >= 0) state.pinnedTools.splice(i, 1);
    else state.pinnedTools.push(key);
    renderTool(); renderTiles(); renderHeaderTools(); renderToolDrop();
  }

  /* Placement is the array order, so moving a pin is moving an index. In the
     real shell this is a drag inside the rail; the arrows are the keyboard
     path, which has to exist anyway. */
  function movePin(key, delta) {
    const i = state.pinnedTools.indexOf(key);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= state.pinnedTools.length) return;
    [state.pinnedTools[i], state.pinnedTools[j]] = [state.pinnedTools[j], state.pinnedTools[i]];
    renderTool(); renderTiles(); renderHeaderTools();
  }

  /* A BARE KEY MAY NEVER BE BOUND. A wedge scanner emits keystrokes, so a
     single-character binding is a scan waiting to fire a tool — the same
     hazard I3 exists for. Modifier required, and collisions are refused
     rather than silently shadowing an existing chord. */
  function setKeybind(id, chord) {
    const c = (chord || '').trim();
    if (!c) { delete state.keybinds[id]; renderTiles(); return; }
    if (!/^(Ctrl|Alt|Shift|Meta)\+/i.test(c)) { state.keybindError = `${c} needs a modifier \u2014 a bare key can be fired by a scanner`; renderTiles(); return; }
    const clash = Object.entries(state.keybinds).find(([k, v]) => v.toLowerCase() === c.toLowerCase() && k !== id);
    if (clash) { state.keybindError = `${c} is already ${clash[0]}`; renderTiles(); return; }
    state.keybindError = null;
    state.keybinds[id] = c;
    renderTiles();
  }

  function setPref(key, value) {
    state.prefs[key] = key === 'radius' ? Number(value) : value;
    applyPrefs();
    renderTiles();
  }

  function showCtx(e, tileId) {
    state.ctxTarget = tileId;
    ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 200) + 'px';
    ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 180) + 'px';
    ctxMenu.classList.add('open');
  }

  function ctxSplit() {
    const tile = state.tiles.find(t => t.id === state.ctxTarget) || state.tiles.find(t => t.focused);
    if (!tile) return;
    const id = 't' + (++seq) + '-split';
    state.tiles.push({ id, tab: tile.tab, title: tile.title + ' (2)', color: tile.color, icon: tile.icon, type: tile.type, focused: true });
    state.tiles.forEach(t => t.focused = (t.id === id));
    renderTiles();
    closeCtx();
  }

  function ctxRename() {
    const tile = state.tiles.find(t => t.id === state.ctxTarget);
    if (!tile) return closeCtx();
    const name = prompt('Rename tab:', tile.title);
    if (name) {
      tile.title = name;
      const tab = state.tabs.find(t => t.id === tile.tab);
      if (tab) tab.title = name;
      renderTiles(); renderTabs();
    }
    closeCtx();
  }

  function ctxIcon() {
    const tile = state.tiles.find(t => t.id === state.ctxTarget);
    if (!tile) return closeCtx();
    const tab = state.tabs.find(t => t.id === tile.tab);
    const next = ICONS[(ICONS.indexOf(tile.icon) + 1) % ICONS.length];
    tile.icon = next;
    if (tab) tab.icon = next;
    renderTabs();
    closeCtx();
  }

  function ctxColor() {
    const tile = state.tiles.find(t => t.id === state.ctxTarget);
    if (!tile) return closeCtx();
    const tab = state.tabs.find(t => t.id === tile.tab);
    const next = PALETTE[(PALETTE.indexOf(tile.color) + 1) % PALETTE.length];
    tile.color = next;
    if (tab) tab.color = next;
    renderTiles(); renderTabs();
    closeCtx();
  }

  /* Closing a tile closes its TAB too. A tab is "currently open" — that is
     the whole difference between a tab and a pin — so leaving the tab behind
     after the tile is gone would be the rail claiming something is open when
     nothing is. A pin is untouched; that is what a pin is for. */
  function closeTile(id) {
    const tile = state.tiles.find(t => t.id === id);
    if (!tile) return;
    state.tiles = state.tiles.filter(t => t.id !== id);
    if (tile.tab) {
      state.tabs = state.tabs.filter(t => t.id !== tile.tab);
      if (state.activeTab === tile.tab) state.activeTab = null;
    }
    if (state.tiles.length && !state.tiles.some(t => t.focused)) {
      state.tiles[0].focused = true;
      state.activeTab = state.tiles[0].tab || state.activeTab;
    }
    renderTiles();
    renderTabs();
  }

  function ctxClose() {
    closeTile(state.ctxTarget);
    closeCtx();
  }

  function closeCtx() { ctxMenu.classList.remove('open'); state.ctxTarget = null; }

  function toggleRecents() {
    state.recentsCollapsed = !state.recentsCollapsed;
    renderRecents();
  }

  /* Applying a queued proposal makes it an APPLIED agent mutation. It does
     not become an operator action — `actor_kind` stays 'agent', because the
     trust stats read acceptance rate and a human approving a proposal is
     exactly the signal that widens that kind's trust class. */
  function agentApply(id) {
    state.agentQueue = state.agentQueue.filter(m => m.id !== id);
    state.agentApplied += 1;
    renderTool();
  }
  function agentDismiss(id) {
    state.agentQueue = state.agentQueue.filter(m => m.id !== id);
    renderTool();
  }
  function agentUndo() {
    if (state.agentApplied > 0) state.agentApplied -= 1;
    renderTool();
  }

  function toggleTimer() { state.timerRunning = !state.timerRunning; renderTool(); }
  function resetTimer() { state.timer = 0; renderTool(); }
  function toggleSw() { state.swRunning = !state.swRunning; renderTool(); }
  function resetSw() { state.stopwatch = 0; renderTool(); }

  function toggleSessionPopover() { sessionPopover.classList.toggle('open'); }

  /* Rename in place, in the beam. The operator names the work while
     doing it. Enter commits, Escape reverts, blur commits. */
  function beginRename() {
    const btn = $('sessionTitle');
    if (btn.dataset.editing === '1') return;
    const input = document.createElement('input');
    input.className = 'session-title-input';
    input.value = state.sessionName;
    input.setAttribute('aria-label', 'Session name');
    btn.dataset.editing = '1';
    btn.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    const finish = commit => {
      if (done) return;
      done = true;
      if (commit) state.sessionName = input.value.trim();
      const fresh = document.createElement('button');
      fresh.className = 'session-title';
      fresh.id = 'sessionTitle';
      fresh.title = 'Click to rename this session';
      fresh.onclick = beginRename;
      input.replaceWith(fresh);
      $('sessionNameInput').value = state.sessionName;
      renderSession();
      renderTiles();
    };
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  function renameSession(name) {
    state.sessionName = name;
    renderSession();
    renderTiles();
  }

  function parkSession() {
    state.sessionState = 'parked';
    renderSession();
    renderTool();   // session-scoped tools leave the rail with the arm
    toggleSessionPopover();
  }

  function closeSession() {
    state.sessionState = 'ended';
    state.tiles = state.tiles.filter(t => t.type !== 'session');
    if (state.tiles.length) state.tiles[0].focused = true;
    renderTiles();
    renderSession();
    renderTool();
    toggleSessionPopover();
  }

  function setTheme(next) {
    state.theme = next;
    document.body.setAttribute('data-theme', next);
    renderSettings();
  }

  function toggleTheme() { setTheme(state.theme === 'light' ? 'dark' : 'light'); }

  /* SETTINGS — the bottom-left corner's one panel. Theme lives here, and so
     does a second way to expand either rail, for an operator who found the
     preference before they found the chevron. */
  function toggleSettings() {
    const open = settingsPopover.classList.toggle('open');
    $('btnSettings').classList.toggle('active', open);
    if (open) renderSettings();
  }

  function renderSettings() {
    document.querySelectorAll('#themeToggle span').forEach(el => {
      el.classList.toggle('active', el.dataset.themeSet === state.theme);
    });
    document.querySelectorAll('#railToggle span').forEach(el => {
      el.classList.toggle('active', el.dataset.rail === 'left'
        ? state.leftExpanded
        : state.rightExpanded);
    });
  }

  function toggleOffline() {
    state.offline = !state.offline;
    $('offlineBanner').classList.toggle('open', state.offline);
  }

  // ---- LAUNCHER ----
  const GROUPS = [
    { label: 'Sessions', items: [
      { title: 'Unbox session', meta: 'Start receiving cartons', icon: 'box', run: () => addTile('unbox','Unbox','session') },
      { title: 'Packing session', meta: 'Pack graded units', icon: 'box', run: () => addTile('packing','Packing','session') },
      { title: 'QC session', meta: 'Quality control', icon: 'box', run: () => addTile('qc','QC','session') },
      { title: 'FBA shipment build', meta: 'Task session \u00b7 the unit of work is the BATCH', icon: 'box', run: () => addTile('fba-build','FBA shipment','session') }
    ]},
    /* The work QUEUES live here now, not in a rail. A queue is a table:
       it wants width, columns, sort and virtualization, none of which a
       208px strip can give it. Every one of these was a sidebar rail. */
    { label: 'Tables', items: [
      { title: 'Triage queue', meta: 'Was: receiving triage rail', icon: 'table', run: () => addTile('triage','Triage','table') },
      { title: 'Receiving feed', meta: 'Was: unbox recent rail', icon: 'table', run: () => addTile('receiving','Receiving','table') },
      { title: 'Pickup queue', meta: 'Was: pickup sidebar rail', icon: 'table', run: () => addTile('pickup','Pickup','table') },
      { title: 'Label prints', meta: 'Was: product-labels rail', icon: 'table', run: () => addTile('labels','Labels','table') },
      { title: 'Settings', meta: 'A tile like everything else \u00b7 arrangement \u00b7 comfort \u00b7 meaning', icon: 'settings', run: () => addTile('settings','Settings','table') },
      { title: 'Orders exceptions', meta: 'What the sync could not place \u00b7 one row = one fix', icon: 'table', run: () => addTile('orders-exceptions','Orders exceptions','table') },
      { title: 'Staff activity', meta: 'Per staff \u00b7 live session heartbeats', icon: 'check', run: () => addTile('staff','Staff activity','table') },
      { title: 'Units', meta: 'All inventory units', icon: 'table', run: () => addTile('units','Units','table') },
      { title: 'Orders', meta: 'Open orders', icon: 'table', run: () => addTile('orders','Orders','table') },
      { title: 'Returns', meta: 'Return merchandise', icon: 'table', run: () => addTile('returns','Returns','table') }
    ]},
    { label: 'Tools', items: [
      { title: 'Pairing', meta: 'TRK# to serial', icon: 'split', run: () => toggleTool('pairing') },
      { title: 'Timer', meta: 'Session elapsed time', icon: 'timer', run: () => toggleTool('timer') },
      { title: 'Stopwatch', meta: 'Lap timing', icon: 'stopwatch', run: () => toggleTool('stopwatch') },
      { title: 'Photo library', meta: 'Unit photos', icon: 'image', run: () => toggleTool('photos') },
      { title: 'Manuals', meta: 'Product documentation', icon: 'book', run: () => toggleTool('manuals') },
      { title: 'Label printer', meta: 'Print shipping labels', icon: 'printer', run: () => toggleTool('printer') },
      { title: 'Calculator', meta: 'Quick math', icon: 'calc', run: () => toggleTool('calc') }
    ]},
    /* Workspaces live in the launcher, not in new rail furniture. */
    { label: 'Workspaces', items: [
      { title: 'Save current workspace\u2026', meta: 'Geometry + tables. Never the session', icon: 'check', run: () => saveWorkspace() },
    ]},
    { label: 'Admin', items: [
      { title: 'Toggle theme', meta: 'Light / dark', icon: 'palette', run: () => toggleTheme() },
      { title: 'Header readout \u2014 pace', meta: 'Elapsed + target, coloured', icon: 'timer', run: () => setFaceMode('pace') },
      { title: 'Header readout \u2014 elapsed only', meta: 'The clock, never a verdict', icon: 'timer', run: () => setFaceMode('elapsed') },
      { title: 'Header readout \u2014 off', meta: 'Hide it. Work is still recorded', icon: 'timer', run: () => setFaceMode('off') },
      { title: 'Simulate offline', meta: 'Show the queued-changes banner', icon: 'wifi-off', run: () => toggleOffline() }
    ]}
  ];

  /* Applying a workspace rebuilds the TABLE tabs and leaves the session tile
     exactly where it is. Nothing is parked, nothing is armed — switching a
     workspace is navigation, and S3 says parking is a work event. */
  function applyWorkspace(id) {
    const w = state.savedWorkspaces.find(x => x.id === id);
    if (!w) return;
    const session = state.tiles.find(t => t.type === 'session');
    const keep = session && w.sessionSlot ? [session] : [];
    state.tiles = [...keep];
    state.tabs = state.tabs.filter(t => keep.some(k => k.tab === t.id));
    w.tabs.forEach((ref, i) => {
      const title = ref.charAt(0).toUpperCase() + ref.slice(1);
      const color = PALETTE[i % PALETTE.length];
      state.tiles.push({ id:'w'+i+'-'+ref, tab:ref, title, color, icon:'table', type:'table', focused:false });
      if (!state.tabs.some(t => t.id === ref)) {
        state.tabs.push({ id:ref, title, color, icon:'table', type:'table' });
      }
    });
    if (state.tiles.length) state.tiles[0].focused = true;
    renderTiles(); renderTabs(); renderTool();
  }

  function saveWorkspace() {
    const name = prompt('Name this workspace:', 'Bench ' + (state.savedWorkspaces.length + 1));
    if (!name) return;
    state.savedWorkspaces.push({
      id: 'w-' + (++seq),
      name,
      /* A SLOT, never a session id. */
      sessionSlot: state.tiles.some(t => t.type === 'session'),
      tabs: state.tiles.filter(t => t.type !== 'session').map(t => t.tab),
    });
    closeLauncher();
  }

  function openLauncher(prefill) {
    launcher.classList.add('open');
    launcherInput.value = prefill || '';
    state.launcherIndex = 0;
    renderLauncherResults(launcherInput.value);
    launcherInput.focus();
  }

  function closeLauncher() { launcher.classList.remove('open'); }
  function openToolLauncher() { openLauncher('tool'); }

  function renderLauncherResults(query) {
    const q = (query || '').toLowerCase().trim();
    state.launcherFlat = [];
    let html = '';
    const savedRows = state.savedWorkspaces.map(w => ({
      title: w.name,
      meta: `${w.tabs.length} tables${w.sessionSlot ? ' \u00b7 keeps your session' : ' \u00b7 no session slot'}`,
      icon: 'table',
      run: () => applyWorkspace(w.id),
    }));
    const ALL = GROUPS.map(g =>
      g.label === 'Workspaces' ? { ...g, items: [...savedRows, ...g.items] } : g);
    ALL.forEach(g => {
      const items = g.items.filter(i =>
        !q || i.title.toLowerCase().includes(q) || i.meta.toLowerCase().includes(q) || g.label.toLowerCase().includes(q));
      if (!items.length) return;
      html += `<div class="launcher-group"><div class="launcher-group-label">${g.label}</div>`;
      items.forEach(item => {
        const i = state.launcherFlat.length;
        state.launcherFlat.push(item);
        html += `
          <div class="launcher-item${i === state.launcherIndex ? ' selected' : ''}" data-i="${i}" onclick="App.launcherRun(${i})">
            <div class="launcher-item-icon">${iconFor(item.icon, 13)}</div>
            <div>
              <div class="launcher-item-title">${escapeHtml(item.title)}</div>
              <div class="launcher-item-meta">${escapeHtml(item.meta)}</div>
            </div>
            ${i === state.launcherIndex ? '<span class="launcher-item-kbd">↵</span>' : ''}
          </div>`;
      });
      html += '</div>';
    });
    /* No exact match is not a dead end — it is the orchestration case. The
       launcher is already the one "tell me what you want" surface, so natural
       language belongs HERE, not behind a second input. */
    if (!html && q) {
      state.launcherFlat = [{ run: () => { toggleTool('ai'); } }];
      html = `<div class="launcher-group">
        <div class="launcher-group-label">Assistant</div>
        <div class="launcher-item selected" data-i="0" onclick="App.launcherRun(0)">
          <div class="launcher-item-icon">${iconFor('assistant', 13)}</div>
          <div>
            <div class="launcher-item-title">Ask the assistant</div>
            <div class="launcher-item-meta">\u201c${escapeHtml(query)}\u201d \u2014 no exact match</div>
          </div>
          <span class="launcher-item-kbd">\u21b5</span>
        </div></div>`;
    } else if (!html) {
      html = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">Type to search</div>';
    }
    launcherResults.innerHTML = html;
  }

  function moveLauncher(delta) {
    if (!state.launcherFlat.length) return;
    state.launcherIndex = (state.launcherIndex + delta + state.launcherFlat.length) % state.launcherFlat.length;
    renderLauncherResults(launcherInput.value);
    const sel = launcherResults.querySelector('.launcher-item.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  function launcherRun(i) {
    const item = state.launcherFlat[i];
    if (item) { item.run(); closeLauncher(); }
  }

  // ---- UTILS ----
  function iconFor(name, size=14) {
    const map = {
      box: 'icon-box', table: 'icon-table', file: 'icon-file',
      timer: 'icon-timer', stopwatch: 'icon-stopwatch', image: 'icon-image',
      book: 'icon-book', printer: 'icon-printer', calc: 'icon-calc',
      check: 'icon-check', split: 'icon-split', palette: 'icon-palette',
      search: 'icon-search', last: 'icon-last', assistant: 'icon-assistant',
      settings: 'icon-settings',
      'wifi-off': 'icon-wifi-off'
    };
    const href = map[name] || 'icon-box';
    return `<svg width="${size}" height="${size}"><use href="#${href}"/></svg>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function fmtTime(s) {
    const h = Math.floor(s/3600).toString().padStart(2,'0');
    const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${h}:${m}:${sec}`;
  }

  // ---- EVENTS ----
  document.addEventListener('click', () => {
    closeCtx();
    if (settingsPopover.classList.contains('open')) toggleSettings();
  });
  ctxMenu.addEventListener('click', e => e.stopPropagation());

  $('themeToggle').addEventListener('click', e => {
    const next = e.target.dataset.themeSet;
    if (next) setTheme(next);
  });

  $('railToggle').addEventListener('click', e => {
    const side = e.target.dataset.rail;
    if (side) toggleRail(side);
  });

  /* Mode errors are prevented by naming the DESTINATION, not by asking the
     operator to remember which mode they are in. The placeholder is that
     readout: it always says where this field's contents are going. */
  function renderScanMode() {
    document.querySelectorAll('#scanModes span').forEach(el => {
      const m = el.dataset.mode;
      if (!m) return;
      el.classList.toggle('active', (m === 'auto' || m === 'manual')
        ? state.scanMode.input === m
        : state.scanMode.action === m);
    });
    const target = state.scanMode.input === 'manual'
      ? 'SCAN · TYPING COUNTS AS A SCAN'
      : state.scanMode.action === 'filter'
        ? 'SCAN · OR TYPE TO FILTER THIS TILE'
        : 'SCAN · OR TYPE TO SEARCH';
    $('scanInput').placeholder = target;
  }

  $('scanModes').addEventListener('click', e => {
    const mode = e.target.dataset.mode;
    if (!mode) return;
    if (mode === 'auto' || mode === 'manual') state.scanMode.input = mode;
    else state.scanMode.action = mode;
    renderScanMode();
  });

  /* Typing opens the launcher in place — no button, no mode switch, and the
     session is NOT parked: a wedge burst and human typing are different input
     paths, so the arm never drops for a lookup. */
  $('scanInput').addEventListener('input', e => {
    const v = e.target.value;
    if (state.scanMode.input === 'manual' || state.scanMode.action === 'filter') return;
    if (v.length >= 2) { openLauncher(v); e.target.value = ''; }
  });

  launcherInput.addEventListener('input', e => { state.launcherIndex = 0; renderLauncherResults(e.target.value); });

  launcherInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveLauncher(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveLauncher(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); launcherRun(state.launcherIndex); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeLauncher();
      closeCtx();
      if (sessionPopover.classList.contains('open')) toggleSessionPopover();
      if (settingsPopover.classList.contains('open')) toggleSettings();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && !e.altKey) {
      const k = e.key.toLowerCase();
      if (k === 'n' || k === 'k') { e.preventDefault(); openLauncher(); }
      else if (e.key === '\\') { e.preventDefault(); ctxSplit(); }
      else if (k === 'o' && e.shiftKey) { e.preventDefault(); toggleOffline(); }
      else if (k === 'b') { e.preventDefault(); toggleRail(e.shiftKey ? 'right' : 'left'); }
      else if (k === 'w' && !e.shiftKey) {
        e.preventDefault();
        const focused = state.tiles.find(t => t.focused);
        if (focused) closeTile(focused.id);
      }
    }
  });

  // ---- CLOCK ----
  /* The heartbeat. Only `version` moves — no event bodies. A real client
     re-fetches a staffer's ops_events page only when their version passes
     what it already holds. */
  setInterval(() => {
    state.staff.forEach(p => {
      if (!p.live) return;
      p.version += 1;
      p.today += 1;
      const cell = document.querySelector(`[data-ver="${p.id}"]`);
      if (cell) cell.textContent = p.version;
    });
  }, 3000);

  setInterval(() => {
    if (state.timerRunning) {
      state.timer++;
      renderFace();
      if (state.openTool === 'timer' && state.toolPanelOpen) renderTool();
    }
    if (state.swRunning) {
      state.stopwatch += 1;
      if (state.openTool === 'stopwatch' && state.toolPanelOpen) renderTool();
    }
  }, 1000);

  // ---- INIT ----
  renderPins();
  renderTabs();
  renderRecents();
  renderTiles();
  renderTool();
  renderPipeline();
  renderSession();
  renderFace();
  renderHeaderTools();
  renderToolDrop();
  applyPrefs();

  renderScanMode();
  renderSettings();

  return {
    toggleRail, toggleTool, closeToolPanel, focusTab, addTile,
    showCtx, ctxSplit, ctxRename, ctxIcon, ctxColor, ctxClose, closeTile,
    toggleRecents, toggleTimer, resetTimer, toggleSw, resetSw,
    toggleSessionPopover, beginRename, renameSession, parkSession, closeSession, openStaffTrail,
    toggleTheme, toggleSettings, toggleOffline, openLauncher, closeLauncher, openToolLauncher, launcherRun,
    applyWorkspace, saveWorkspace, agentApply, agentDismiss, agentUndo, setFaceMode,
    importStep, importFix, fbaPick, runImport, setPref, togglePin, movePin, setKeybind,
    toggleToolDrop, showPinCtx, dropPinFromMenu, closeCtx
  };
})();
</script>
</body>
