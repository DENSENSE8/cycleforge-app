# Cycle Forge desktop shell — LEGACY Intel macOS build.
#
# Why a second config at all: Electron 41 sets a hard floor of macOS 11 (Big
# Sur). Electron 22 is the last major line that runs on macOS 10.13 (High
# Sierra) → 10.15 (Catalina), which is where 2012–2015 Intel Macs are stranded.
# Every other target — Apple Silicon, modern Intel (macOS 11+), Windows — ships
# the current Electron from `electron-builder.yml`.
#
#   pnpm desktop:dist:mac-intel-legacy
#
# READ BEFORE SHIPPING THIS TARGET
#
# 1. Electron 22 is END OF LIFE and receives no Chromium security patches. That
#    is a real risk to weigh, not a footnote. It is *narrowed* here — the shell
#    only ever loads our own allowlisted origins, and out-of-allowlist links go
#    to the OS browser (`isInternalUrl` in main.js) — but an EOL renderer is
#    still an EOL renderer. Prefer replacing the hardware where you can.
#
# 2. Auto-update is deliberately NOT published from this config, and
#    `electron/main.js` disables electron-updater on Electron < 23. The update
#    feed carries builds made with current Electron, which will not launch on
#    macOS 10.x — so an unguarded legacy build would download an update that
#    BRICKS it. Do not "fix" that by publishing here.
#
# 3. N5 VendorView needs `WebContentsView`, added in Electron 30. It is absent
#    on this line, so `electron/vendor-view.js` reports the capability as
#    unavailable and callers fall back to opening the vendor console in the OS
#    browser. Verify that fallback if you ship to a legacy bench.

appId: com.cycleforge.desktop
productName: Cycle Forge

# Pin the Electron used at PACKAGING time — independent of the version in
# node_modules. electron-builder downloads this on demand.
electronVersion: 22.3.27

asar: true

directories:
  # Same two-manifest layout as the modern config: the app root is electron/,
  # so only the shell's own deps ship (not the Next app's dependency tree).
  app: electron
  output: desktop-dist
  buildResources: build

files:
  - '**/*'

mac:
  category: public.app-category.business
  # Written into Info.plist, so the OS refuses to launch on anything older.
  # 10.13 is the Electron 22 floor.
  minimumSystemVersion: '10.13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  notarize: false
  target:
    # dmg only — no zip, because zip exists to feed electron-updater and this
    # target must never self-update (see note 2 above).
    - target: dmg
      arch:
        - x64
  # Space-free, and "-legacy" so it is trivially distinguishable from the
  # modern Intel dmg. GitHub Releases rewrites spaces in asset names to dots.
  artifactName: CycleForge-${version}-x64-legacy.${ext}

dmg:
  title: Cycle Forge ${version} (Intel · legacy)

# NO `publish:` block — this target is distributed by hand, never through the
# auto-update feed.
