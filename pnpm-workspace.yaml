  - '@vercel/express@6.0.0'
  - '@vercel/fastify@6.0.0'
  - '@vercel/gatsby-plugin-vercel-builder@2.2.51'
  - '@vercel/go@9.0.0'
  - '@vercel/h3@6.0.0'
  - '@vercel/hono@6.0.0'
  - '@vercel/hydrogen@7.0.0'
