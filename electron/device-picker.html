<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Select a device</title>
    <style>
      /* No layout animation anywhere in here: a chooser that tweens is a
         chooser the operator is waiting on. Colour only. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #e2e8f0;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      h1 {
        margin: 0;
        padding: 14px 16px 10px;
        font-size: 13px;
        font-weight: 600;
        color: #f1f5f9;
      }
      p.hint {
        margin: 0;
        padding: 0 16px 10px;
        color: #94a3b8;
        font-size: 12px;
      }
      ul {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0 8px;
        list-style: none;
      }
      li button {
        display: block;
        width: 100%;
        margin: 0 0 4px;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: #111c30;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      li button:hover,
      li button:focus-visible {
        background: #17253d;
        border-color: #2563eb;
        outline: none;
      }
      .name {
        color: #f1f5f9;
      }
      .detail {
        color: #94a3b8;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .known {
        color: #34d399;
        font-size: 11px;
      }
      .empty {
        padding: 16px;
        color: #94a3b8;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        padding: 10px 16px 14px;
      }
      footer button {
        padding: 7px 14px;
        border: 1px solid #334155;
        border-radius: 6px;
        background: #0f1a2c;
        color: #cbd5e1;
        font: inherit;
        cursor: pointer;
      }
      footer button:hover,
      footer button:focus-visible {
        border-color: #64748b;
        color: #f1f5f9;
        outline: none;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Select a device</h1>
    <p class="hint" id="hint">Choose the printer to pair with Cycle Forge.</p>
    <ul id="list" aria-labelledby="heading"></ul>
    <footer><button type="button" id="cancel">Cancel</button></footer>
    <script>
      const api = window.cycleForgeDevicePicker;
      const list = document.getElementById('list');
      const heading = document.getElementById('heading');
      const hint = document.getElementById('hint');

      const TITLES = {
        usb: 'Select a USB device',
        serial: 'Select a serial port',
        hid: 'Select an HID device',
      };

      function render(payload) {
        const items = (payload && payload.items) || [];
        heading.textContent = TITLES[payload && payload.deviceType] || 'Select a device';
        hint.textContent = items.length
          ? 'Choose the printer to pair with Cycle Forge.'
          : 'Nothing connected. Plug the printer in — this list updates itself.';
        list.replaceChildren();
        for (const item of items) {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = item.label;
          button.appendChild(name);
          if (item.detail) {
            const detail = document.createElement('div');
            detail.className = 'detail';
            detail.textContent = item.detail;
            button.appendChild(detail);
          }
          if (item.known) {
            const known = document.createElement('div');
            known.className = 'known';
            known.textContent = 'Already paired';
            button.appendChild(known);
          }
          button.addEventListener('click', () => api.choose(item.id));
          li.appendChild(button);
          list.appendChild(li);
        }
        const first = list.querySelector('button');
        if (first) first.focus();
      }

      if (api) {
        api.onList(render);
        document.getElementById('cancel').addEventListener('click', () => api.cancel());
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') api.cancel();
        });
      }
    </script>
  </body>
</html>
