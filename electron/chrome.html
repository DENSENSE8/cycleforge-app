<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cycle Forge</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #94a3b8;
        font: 12px/1.2 ui-sans-serif, system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .controls {
        position: fixed;
        top: 12px;
        display: none;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .controls.visible {
        display: flex;
      }
      .controls.left {
        left: 14px;
      }
      .controls.right {
        right: 14px;
      }
      button {
        width: 12px;
        height: 12px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
      }
      .close {
        background: #ff5f57;
      }
      .min {
        background: #febc2e;
      }
      .max {
        background: #28c840;
      }
    </style>
  </head>
  <body>
    <div id="controls" class="controls" aria-label="Window">
      <button type="button" class="close" data-action="close" aria-label="Close"></button>
      <button type="button" class="min" data-action="min" aria-label="Minimize"></button>
      <button type="button" class="max" data-action="max" aria-label="Maximize"></button>
    </div>
    <script>
      const chromeApi = window.cycleForgeChrome;
      const controls = document.getElementById('controls');
      if (chromeApi && chromeApi.platform !== 'darwin') {
        controls.classList.add('visible', chromeApi.platform === 'win32' ? 'right' : 'left');
        controls.addEventListener('click', (event) => {
          const action = event.target && event.target.dataset && event.target.dataset.action;
          if (action) chromeApi.windowAction(action);
        });
      }
      document.addEventListener('dblclick', (event) => {
        if (event.target.closest && event.target.closest('.controls')) return;
        chromeApi && chromeApi.windowAction('max');
      });
    </script>
  </body>
</html>
